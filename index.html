<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="UTF-8">

<title>Premium Practice Mock</title>

<style>
.notranslate{translate:none!important;}
body{margin:0;padding-bottom:90px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7f6}
.topbar{background:linear-gradient(135deg,#00bfff,#008ccc);color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.1)}

.action-btn:active{transform:scale(.95)}

.option.selected .circle{background:#00bfff;border:4px solid white;box-shadow:0 0 0 2px #00bfff}

.palette h3{margin-top:0;color:#333;border-bottom:2px solid #eee;padding-bottom:10px}
.palette.active{right:0}
.palette button{width:45px;height:45px;margin:6px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
.notvisited{background:#e0e0e0;color:#555}
.answered{background:#4CAF50;color:white}
.notanswered{background:#e53935;color:white}
.review{background:#ff9800;color:white}
.result{display:none;padding:15px 15px 110px}
.result-card{background:white;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,.05);text-align:center;font-size:16px}
.result-card b{font-size:20px;color:#008ccc}
.analysis-box{background:white;padding:15px;margin-bottom:12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.analysis-box.correct-box{border-left:5px solid #4CAF50}
.analysis-box.wrong-box{border-left:5px solid #e53935}
.analysis-box.unattempted-box{border-left:5px solid #ff9800}
.float-btn{position:fixed;bottom:105px;right:25px;width:60px;height:60px;background:#00bfff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:28px;box-shadow:0 4px 15px rgba(0,191,255,.4);z-index:999;cursor:pointer}
.close-palette{position:absolute;right:20px;top:20px;background:red;color:white;border:none;border-radius:5px;padding:5px 10px;font-weight:bold;cursor:pointer}
.custom-modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:2000;justify-content:center;align-items:center}
.custom-modal-box{background:white;padding:25px;border-radius:15px;text-align:center;width:85%;max-width:350px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.custom-modal-btns{display:flex;justify-content:space-around;gap:15px}
.btn-cancel{background:#e0e0e0;color:#333;padding:12px;border:none;border-radius:8px;flex:1;font-weight:bold}
.btn-submit{background:#4CAF50;color:white;padding:12px;border:none;border-radius:8px;flex:1;font-weight:bold}
.motivation-banner{background:#e8f5e9;border:2px solid #4CAF50;color:#2e7d32;padding:15px;border-radius:10px;margin-top:15px;font-weight:bold;text-align:center;font-size:18px}
.promo-banner{background:linear-gradient(135deg,#673ab7,#512da8);color:white;padding:20px;border-radius:12px;text-align:center;margin-top:25px;margin-bottom:30px}
.promo-btn{display:inline-block;background:#ff9800;color:white;text-decoration:none;padding:12px 25px;border-radius:25px;font-weight:bold}

@media(max-width:420px){
.button-row{padding:10px 5px;gap:5px}
.action-btn{padding:11px 9px;font-size:12px}
}
</style>
</head>

<body>

<div class="topbar">
<span onclick="togglePalette()" style="cursor:pointer" id="top-title">☰ Practice Mock</span>
<div class="timer-box" id="timer">00:00</div>
</div>

<div class="qheader" id="question-header">
<div>Question : <span id="qno">1</span> / <span id="totalq">0</span></div>
<div class="last" id="lastMin">--</div>
</div>

<div id="exam">
<h3 style="text-align:center;padding:20px">⏳ टेस्ट लोड हो रहा है...</h3>
</div>

<div class="button-row" id="top-btn-row">
<button class="action-btn" onclick="previousQuestion()">Back</button>
<button class="action-btn" style="background:#ff9800" onclick="markReview()">Review</button>
<button class="action-btn" onclick="saveNext()">Save & Next</button>
<button class="action-btn submit-btn" onclick="showSubmitConfirm()">Submit</button>
</div>

<div class="palette" id="palette">
<button class="close-palette" onclick="togglePalette()">X</button>
<h3>Questions Palette</h3>
<div id="palette-buttons"></div>
</div>

<div id="submit-confirm-modal" class="custom-modal-overlay">
<div class="custom-modal-box">
<h3>Submit Test?</h3>
<p>क्या आप सच में टेस्ट सबमिट करना चाहते हैं?</p>
<div class="custom-modal-btns">
<button class="btn-cancel" onclick="hideSubmitConfirm()">रद्द करें</button>
<button class="btn-submit" onclick="executeSubmit()">हाँ, सबमिट करें</button>
</div>
</div>
</div>

<div class="result notranslate" id="result" translate="no"></div>
<div class="float-btn" id="menu-float-btn" onclick="togglePalette()">≡</div>

<script>
let questions=[];
let current=0;
let answers=[];
let status=[];
let submitted=false;
let time=0;
let timerInterval;
let isReviewMode=false;

let positiveMark=2;
let negativeMark=.25;
let testCutoff=35;

const API_BASE_URL="https://mock-bot-l091.onrender.com";


/* ============================================================
   EXACT CLICKED TEST ID
   ============================================================ */

function getCurrentTestId(){

    const params=
        new URLSearchParams(
            window.location.search
        );

    const urlTestId=
        params.get("test_id");

    if(
        urlTestId!==null &&
        String(urlTestId).trim()!==""
    ){

        const id=
            String(urlTestId).trim();

        sessionStorage.setItem(
            "currentTestId",
            id
        );

        return id;
    }

    return (
        sessionStorage.getItem(
            "currentTestId"
        )||""
    ).trim();
}


/* ============================================================
   TEST LOAD
   ============================================================ */

window.onload=async function(){

    if(
        window.Telegram &&
        window.Telegram.WebApp
    ){
        window.Telegram.WebApp.ready();
    }

    const testId=
        getCurrentTestId();

    const params=
        new URLSearchParams(
            window.location.search
        );

    const savedAnswers=
        params.get("answers");


    if(!testId){

        showLoadError(
            "Test ID नहीं मिला",
            "जिस Test पर आपने क्लिक किया है उसका Test ID URL में नहीं आया।"
        );

        return;
    }


    try{

        /*
         * IMPORTANT:
         *
         * अब 05.json hard-code नहीं है.
         *
         * User जिस test पर click करेगा:
         *
         * ?test_id=123
         *
         * तो:
         *
         * /get_test/123
         *
         * automatically call होगा.
         */

        const response=
            await fetch(
                `${API_BASE_URL}/get_test/${encodeURIComponent(testId)}`,
                {
                    method:"GET",
                    cache:"no-store",
                    headers:{
                        "Accept":"application/json"
                    }
                }
            );


        if(!response.ok){

            let serverMessage="";

            try{
                const errorData=
                    await response.json();

                serverMessage=
                    errorData.message ||
                    errorData.error ||
                    "";
            }catch(e){}


            throw new Error(
                serverMessage ||
                `Test fetch failed (${response.status})`
            );
        }


        const testData=
            await response.json();


        loadTestData(
            testData,
            testId
        );


        if(savedAnswers){

            isReviewMode=true;
            submitted=true;

            try{

                answers=
                    JSON.parse(
                        savedAnswers
                    ).map(
                        value =>
                            value===null ||
                            value===undefined
                                ? null
                                : Number(value)
                    );

            }catch(e){

                answers=
                    new Array(
                        questions.length
                    ).fill(null);

            }

            document.getElementById(
                "top-title"
            ).innerText=
                "📊 Test Analysis";

            executeSubmit(true);

        }else{

            startTimer();
            loadQuestion();

        }


    }catch(error){

        console.error(
            "TEST LOAD ERROR:",
            error
        );

        showLoadError(
            "टेस्ट लोड नहीं हो सका",
            "MongoDB से इस Test का data प्राप्त नहीं हुआ।"
        );

    }

};


/* ============================================================
   MONGODB DATA NORMALIZER
   ============================================================ */

function loadTestData(
    testData,
    testId
){

    /*
     * MongoDB document:
     *
     * {
     *   test_id: "...",
     *   questions: [...]
     * }
     *
     * या
     *
     * [
     *   {section,questions:[...]},
     *   {section,questions:[...]}
     * ]
     *
     * दोनों formats support.
     */

    const rawQuestions=
        Array.isArray(testData)

            ? testData.flatMap(
                section =>
                    Array.isArray(
                        section.questions
                    )
                        ? section.questions
                        : []
            )

            : (
                Array.isArray(
                    testData.questions
                )
                    ? testData.questions
                    : []
            );


    questions=
        rawQuestions
            .map(q=>({

                ...q,

                question:
                    q.question ??
                    q.text ??
                    "",

                options:
                    Array.isArray(q.options)
                        ? q.options
                        : [],

                correctIndex:
                    Number.isInteger(
                        q.correct
                    )
                        ? q.correct
                        : (
                            Array.isArray(q.options) &&
                            q.answer!==undefined
                                ? q.options.indexOf(
                                    q.answer
                                )
                                : -1
                        ),

                answer:
                    typeof q.correct==="number" &&
                    Array.isArray(q.options)
                        ? q.options[q.correct]
                        : (
                            q.answer ??
                            ""
                        ),

                explanation:
                    q.explanation ??
                    q.exp ??
                    ""

            }))
            .filter(
                q =>
                    q.question &&
                    q.options.length>0
            );


    if(!questions.length){

        throw new Error(
            "MongoDB test में questions नहीं हैं"
        );
    }


    const firstSection=
        Array.isArray(testData)
            ? testData[0]
            : testData;


    positiveMark=
        Number(
            testData.positive_mark ??
            firstSection?.positive_mark ??
            2
        );


    negativeMark=
        Number(
            testData.negative_mark ??
            firstSection?.negative_mark ??
            .25
        );


    testCutoff=
        Number(
            testData.cutoff ??
            firstSection?.cutoff ??
            35
        );


    const timeLimit=
        Number(
            testData.time_limit ??
            testData.time ??
            firstSection?.time_limit ??
            firstSection?.time ??
            60
        );


    time=
        timeLimit*60;


    window.currentTestId=
        String(testId);


    document.getElementById(
        "totalq"
    ).innerText=
        questions.length;


    answers=
        new Array(
            questions.length
        ).fill(null);


    status=
        new Array(
            questions.length
        ).fill("notvisited");

}


/* ============================================================
   LOAD ERROR
   ============================================================ */

function showLoadError(
    title,
    message
){

    document.getElementById(
        "timer"
    ).innerText=
        "ERR";

    document.getElementById(
        "totalq"
    ).innerText=
        "0";


    document.getElementById(
        "exam"
    ).innerHTML=
        `
        <div style="
            margin:25px 15px;
            background:#fff;
            border-radius:14px;
            padding:25px 18px;
            text-align:center;
            box-shadow:0 4px 15px rgba(0,0,0,.08);
        ">

            <div style="
                font-size:55px;
                margin-bottom:12px;
            ">
                ⚠️
            </div>

            <h2 style="
                color:#d32f2f;
                margin:0 0 12px;
            ">
                ${escapeHTML(title)}
            </h2>

            <p style="
                color:#555;
                line-height:1.6;
                margin:0;
            ">
                ${escapeHTML(message)}
            </p>

            <button
                onclick="location.reload()"
                style="
                    margin-top:20px;
                    background:#00bfff;
                    color:#fff;
                    border:0;
                    padding:12px 25px;
                    border-radius:8px;
                    font-weight:bold;
                    font-size:15px;
                "
            >
                🔄 Retry
            </button>

        </div>
        `;
}


/* ============================================================
   TIMER
   ============================================================ */

function startTimer(){

    clearInterval(
        timerInterval
    );

    timerInterval=
        setInterval(()=>{

            if(time<0){

                clearInterval(
                    timerInterval
                );

                executeSubmit();

                return;
            }


            let m=
                Math.floor(
                    time/60
                );

            let s=
                time%60;


            document.getElementById(
                "timer"
            ).innerText=
                (m<10?"0"+m:m)+
                ":"+
                (s<10?"0"+s:s);


            document.getElementById(
                "lastMin"
            ).innerText=
                "Last "+
                (m<10?"0"+m:m)+
                " Mins";


            time--;

        },1000);
}


/* ============================================================
   SAFE HTML RENDER
   ============================================================ */

function renderSourceHTML(value){

    if(
        value===null ||
        value===undefined
    ){
        return "";
    }


    const source=
        String(value);


    const parser=
        new DOMParser();


    const doc=
        parser.parseFromString(
            source,
            "text/html"
        );


    const content=
        doc.body
            ? doc.body.innerHTML
            : source;


    const wrapper=
        document.createElement(
            "div"
        );


    wrapper.className=
        "notranslate";


    wrapper.setAttribute(
        "translate",
        "no"
    );


    wrapper.innerHTML=
        content;


    wrapper
        .querySelectorAll("*")
        .forEach(
            el=>{
                el.setAttribute(
                    "translate",
                    "no"
                );

                el.classList.add(
                    "notranslate"
                );
            }
        );


    return wrapper.innerHTML;
}


function escapeHTML(value){

    const div=
        document.createElement(
            "div"
        );

    div.textContent=
        String(value??"");

    return div.innerHTML;
}


/* ============================================================
   QUESTION
   ============================================================ */

function loadQuestion(){

    if(!questions.length){
        return;
    }


    const q=
        questions[current];


    let html=
        "<div class='qcard notranslate' translate='no'>"+
        "<div class='qtitle'>"+
        "Q"+
        (current+1)+
        ". "+
        renderSourceHTML(
            q.question
        )+
        "</div>";


    if(
        q.img &&
        q.img!==""
    ){

        html+=
            "<div style='text-align:center;padding:10px;'>"+
            "<img src='"+q.img+"' "+
            "style='max-width:100%;height:auto;border-radius:8px;border:1px solid #ddd;'>"+
            "</div>";

    }


    q.options.forEach(
        (opt,i)=>{

            const selected=
                answers[current]===i
                    ? "selected"
                    : "";


            html+=
                "<div class='option "+
                selected+
                " notranslate' "+
                "translate='no' "+
                "onclick='selectOption(this,"+
                i+
                ")'>"+

                "<div class='circle'></div>"+

                renderSourceHTML(
                    opt
                )+

                "</div>";

        }
    );


    html+="</div>";


    document.getElementById(
        "exam"
    ).innerHTML=
        html;


    document.getElementById(
        "qno"
    ).innerText=
        current+1;


    updatePalette();


    window.scrollTo(
        0,
        0
    );
}


function selectOption(
    el,
    i
){

    if(submitted){
        return;
    }


    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            o =>
                o.classList.remove(
                    "selected"
                )
        );


    el.classList.add(
        "selected"
    );


    answers[current]=
        i;


    status[current]=
        "answered";


    updatePalette();
}


function saveNext(){

    if(
        answers[current]===null &&
        status[current]!=="review"
    ){

        status[current]=
            "notanswered";
    }


    if(
        current<
        questions.length-1
    ){

        current++;

        loadQuestion();
    }
}


function previousQuestion(){

    if(current>0){

        current--;

        loadQuestion();
    }
}


function markReview(){

    status[current]=
        "review";


    if(
        current<
        questions.length-1
    ){

        current++;

        loadQuestion();

    }else{

        updatePalette();

    }
}


/* ============================================================
   PALETTE
   ============================================================ */

function togglePalette(){

    document
        .getElementById(
            "palette"
        )
        .classList.toggle(
            "active"
        );
}


function updatePalette(){

    let html="";


    questions.forEach(
        (q,i)=>{

            html+=
                "<button class='"+
                status[i]+
                "' onclick='goQ("+
                i+
                ")'>"+
                (i+1)+
                "</button>";

        }
    );


    document.getElementById(
        "palette-buttons"
    ).innerHTML=
        html;
}


function goQ(i){

    current=i;

    loadQuestion();

    document
        .getElementById(
            "palette"
        )
        .classList.remove(
            "active"
        );
}


/* ============================================================
   SUBMIT
   ============================================================ */

function showSubmitConfirm(){

    if(submitted){
        return;
    }


    document.getElementById(
        "submit-confirm-modal"
    ).style.display=
        "flex";
}


function hideSubmitConfirm(){

    document.getElementById(
        "submit-confirm-modal"
    ).style.display=
        "none";
}


function executeSubmit(
    isFromHistory=false
){

    hideSubmitConfirm();


    if(
        submitted &&
        !isFromHistory
    ){
        return;
    }


    submitted=true;


    clearInterval(
        timerInterval
    );


    let correct=0;
    let incorrect=0;
    let unattempted=0;


    questions.forEach(
        (q,i)=>{

            const correctIndex=
                Number.isInteger(
                    q.correctIndex
                )
                    ? q.correctIndex
                    : q.options.indexOf(
                        q.answer
                    );


            if(
                answers[i]===null ||
                answers[i]===undefined
            ){

                unattempted++;

            }else if(
                Number(
                    answers[i]
                )===
                Number(
                    correctIndex
                )
            ){

                correct++;

            }else{

                incorrect++;

            }

        }
    );


    const score=
        (
            correct*
            positiveMark
        )-
        (
            incorrect*
            negativeMark
        );


    const maxScore=
        questions.length*
        positiveMark;


    const accuracy=
        (
            correct/
            (
                correct+
                incorrect||
                1
            )*
            100
        ).toFixed(2);


    if(!isReviewMode){

        const params=
            new URLSearchParams(
                window.location.search
            );


        const uid=
            params.get("uid");


        const name=
            params.get("name");


        /*
         * IMPORTANT:
         * वही Test ID जो user ने click किया था.
         */
        const testId=
            getCurrentTestId();


        if(
            uid &&
            name &&
            testId
        ){

            fetch(
                `${API_BASE_URL}/submit_score`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                parseInt(
                                    uid
                                ),

                            first_name:
                                name,

                            test_id:
                                testId,

                            test_name:
                                "Mock Test",

                            score:
                                parseFloat(
                                    score
                                ),

                            accuracy:
                                parseFloat(
                                    accuracy
                                )

                        })
                }
            ).catch(
                error =>
                    console.error(
                        "Score save error:",
                        error
                    )
            );
        }
    }


    generateResultScreen(
        score,
        maxScore,
        correct,
        incorrect,
        unattempted,
        accuracy
    );
}


/* ============================================================
   RESULT + FULL SOLUTION
   ============================================================ */

function generateResultScreen(
    score,
    maxScore,
    correct,
    incorrect,
    unattempted,
    accuracy
){

    document.getElementById(
        "timer"
    ).style.display=
        "none";


    document.getElementById(
        "question-header"
    ).style.display=
        "none";


    document.getElementById(
        "top-btn-row"
    ).style.display=
        "none";


    document.getElementById(
        "menu-float-btn"
    ).style.display=
        "none";


    document.getElementById(
        "exam"
    ).style.display=
        "none";


    document.getElementById(
        "palette"
    ).style.display=
        "none";


    document.getElementById(
        "result"
    ).style.display=
        "block";


    let html="";


    if(
        score>=
        testCutoff
    ){

        html+=
            "<div class='motivation-banner'>"+
            "🎉 शाबाश! आपने कट-ऑफ ("+
            testCutoff+
            ") पार कर ली है! 🇮🇳"+
            "</div>";

    }else{

        html+=
            "<div class='motivation-banner' "+
            "style='background:#ffebee;border-color:#e53935;color:#c62828;'>"+
            "⚠️ आपका स्कोर कट-ऑफ ("+
            testCutoff+
            ") से कम है। और अभ्यास करें! 💪"+
            "</div>";

    }


    html+=
        "<div class='result-card'>"+
        "<b>Your Score: "+
        score.toFixed(2)+
        " / "+
        maxScore+
        "</b>"+

        "<hr style='border:0;border-top:1px solid #eee;margin:15px 0;'>"+

        "<div style='display:flex;justify-content:space-around;text-align:center;'>"+

        "<div>"+
        "<span style='color:#4CAF50;font-size:24px;font-weight:bold;'>"+
        correct+
        "</span><br><small>Correct</small>"+
        "</div>"+

        "<div>"+
        "<span style='color:#e53935;font-size:24px;font-weight:bold;'>"+
        incorrect+
        "</span><br><small>Wrong</small>"+
        "</div>"+

        "<div>"+
        "<span style='color:#ff9800;font-size:24px;font-weight:bold;'>"+
        unattempted+
        "</span><br><small>Skipped</small>"+
        "</div>"+

        "</div>"+

        "<br>"+

        "<b>Accuracy: "+
        accuracy+
        "%</b>"+

        "</div>"+

        "<div style='max-width:300px;margin:0 auto;'>"+
        "<canvas id='chart'></canvas>"+
        "</div>"+

        "<h3 style='margin-top:30px;border-bottom:2px solid #ccc;padding-bottom:5px;'>"+
        "Full Analysis"+
        "</h3>";


    questions.forEach(
        (q,i)=>{

            const userAns=
                answers[i];


            const correctIndex=
                Number.isInteger(
                    q.correctIndex
                )
                    ? q.correctIndex
                    : q.options.indexOf(
                        q.answer
                    );


            let boxClass=
                "analysis-box";


            let statusText="";


            if(
                userAns===null ||
                userAns===undefined
            ){

                boxClass+=
                    " unattempted-box";

                statusText=
                    "<span style='color:#e65100;font-weight:bold;background:#ffe0b2;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "⚠️ Skipped (0)"+
                    "</span>";

            }else if(
                Number(userAns)===
                Number(correctIndex)
            ){

                boxClass+=
                    " correct-box";

                statusText=
                    "<span style='color:#1b5e20;font-weight:bold;background:#c8e6c9;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "✅ Correct (+"+
                    positiveMark+
                    ")"+
                    "</span>";

            }else{

                boxClass+=
                    " wrong-box";

                statusText=
                    "<span style='color:#b71c1c;font-weight:bold;background:#ffcdd2;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "❌ Wrong (-"+
                    negativeMark+
                    ")"+
                    "</span>";
            }


            html+=
                "<div class='"+
                boxClass+
                " notranslate' translate='no'>";


            html+=
                "<div style='display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;font-size:16px;'>"+

                "<div style='flex:1;min-width:0;'>"+
                "<b>Q"+
                (i+1)+
                ". "+
                renderSourceHTML(
                    q.question
                )+
                "</b>"+
                "</div>"+

                "<div style='text-align:right;min-width:100px;margin-left:10px;'>"+
                statusText+
                "</div>"+

                "</div>";


            if(
                q.img &&
                q.img!==""
            ){

                html+=
                    "<div style='text-align:center;padding:10px;'>"+
                    "<img src='"+q.img+"' style='max-width:100%;height:auto;border-radius:8px;border:1px solid #ddd;'>"+
                    "</div>";

            }


            html+=
                "<div style='margin-top:10px;'>";


            q.options.forEach(
                (opt,optIndex)=>{

                    let style=
                        "padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid #eee;background:#fafafa;color:#333;";

                    let icon="⚪";


                    if(
                        Number(optIndex)===
                        Number(correctIndex)
                    ){

                        style=
                            "padding:12px;margin-bottom:8px;border-radius:8px;border:2px solid #4CAF50;background:#e8f5e9;font-weight:bold;color:#2e7d32;";

                        icon="✅";

                    }else if(
                        userAns!==null &&
                        userAns!==undefined &&
                        Number(optIndex)===
                        Number(userAns)
                    ){

                        style=
                            "padding:12px;margin-bottom:8px;border-radius:8px;border:2px solid #e53935;background:#ffebee;font-weight:bold;color:#c62828;";

                        icon="❌";
                    }


                    html+=
                        "<div class='notranslate' translate='no' style='"+
                        style+
                        "'>"+
                        icon+
                        " "+
                        renderSourceHTML(
                            opt
                        )+
                        "</div>";

                }
            );


            html+="</div>";


            html+=
                "<hr style='border:0;border-top:1px dashed #ccc;margin:20px 0 15px;'>";


            html+=
                "<div style='background:#f4f9ff;padding:15px;border-radius:10px;border:1px solid #d0e3ff;'>"+

                "<div style='display:inline-block;background:linear-gradient(135deg,#00bfff,#007acc);color:white;padding:6px 14px;border-radius:6px;font-weight:bold;font-size:14px;margin-bottom:12px;'>"+
                "💡 Explanation (व्याख्या)"+
                "</div>"+

                "<div class='notranslate' translate='no' style='white-space:pre-wrap;line-height:1.6;font-size:14px;color:#444;'>"+

                (
                    q.explanation
                        ? renderSourceHTML(
                            q.explanation
                        )
                        : "इस प्रश्न के लिए कोई व्याख्या उपलब्ध नहीं है।"
                )+

                "</div>"+

                "</div>"+

                "</div>";

        }
    );


    html+=
        `
        <div class="promo-banner notranslate" translate="no">

            <h3>
                🚀 और नए मॉक टेस्ट चाहिए?
            </h3>

            <p>
                हमारे आधिकारिक टेलीग्राम चैनल से जुड़ें और हर दिन नए टेस्ट, स्टडी मटेरियल और अपडेट्स पाएं!
            </p>

            <a
                href="https://t.me/+bmzuj2Y68nFmYTc9"
                class="promo-btn"
            >
                📢 अभी चैनल ज्वाइन करें
            </a>

        </div>
        `;


    document.getElementById(
        "result"
    ).innerHTML=
        html;


    new Chart(
        document.getElementById(
            "chart"
        ),
        {
            type:"doughnut",

            data:{
                labels:[
                    "Correct",
                    "Incorrect",
                    "Skipped"
                ],

                datasets:[
                    {
                        data:[
                            correct,
                            incorrect,
                            unattempted
                        ],

                        backgroundColor:[
                            "#4CAF50",
                            "#e53935",
                            "#ff9800"
                        ]
                    }
                ]
            }
        }
    );


    window.scrollTo(
        0,
        0
    );
}

</script>

</body>
</html>
