<script>

let questions=[];
let current=0;
let answers=[];
let status=[];
let submitted=false;
let time=0;
let timerInterval;
let isReviewMode=false;

let positiveMark=2.0;
let negativeMark=0.25;
let testCutoff=35.0;

const API_BASE_URL="https://mock-bot-l091.onrender.com";


/* ============================================================
   TEST ID
   ============================================================ */

function getCurrentTestId(){

    const params=
        new URLSearchParams(
            window.location.search
        );

    const urlTestId=
        (
            params.get("test_id") ||
            ""
        ).trim();

    if(urlTestId){

        sessionStorage.setItem(
            "currentTestId",
            urlTestId
        );

        return urlTestId;
    }

    return (
        sessionStorage.getItem(
            "currentTestId"
        ) || ""
    ).trim();
}


/* ============================================================
   VALUE HELPERS
   ============================================================ */

function firstValue(obj,keys){

    if(!obj || typeof obj!=="object"){
        return "";
    }

    for(const key of keys){

        if(
            Object.prototype.hasOwnProperty.call(
                obj,
                key
            ) &&
            obj[key]!==null &&
            obj[key]!==undefined &&
            String(obj[key]).trim()!==""
        ){

            return obj[key];
        }
    }

    return "";
}


function getQuestionText(q){

    return firstValue(
        q,
        [
            "question",
            "question_text",
            "questionText",
            "question_title",
            "text",
            "questionName",
            "title",
            "q"
        ]
    );
}


function getExplanation(q){

    return firstValue(
        q,
        [
            "explanation",
            "exp",
            "solution",
            "solution_text",
            "solutionText",
            "answer_explanation",
            "description"
        ]
    );
}


function getImage(q){

    return firstValue(
        q,
        [
            "img",
            "image",
            "image_link",
            "imageLink",
            "image_url",
            "imageUrl",
            "question_image",
            "questionImage"
        ]
    );
}


function getSectionName(q,parentSection=""){

    return firstValue(
        q,
        [
            "sectionName",
            "section",
            "subject",
            "category",
            "topic"
        ]
    ) || parentSection;
}


/* ============================================================
   OPTIONS NORMALIZER
   ============================================================ */

function getOptions(q){

    if(!q || typeof q!=="object"){
        return [];
    }


    if(Array.isArray(q.options)){
        return q.options;
    }


    const optionKeys=[
        "option",
        "choices",
        "answers",
        "optionsData"
    ];


    for(const key of optionKeys){

        if(Array.isArray(q[key])){
            return q[key];
        }

    }


    const possibleKeys=[
        ["A","B","C","D"],
        ["a","b","c","d"],
        ["optionA","optionB","optionC","optionD"],
        ["option_a","option_b","option_c","option_d"]
    ];


    for(const keys of possibleKeys){

        if(
            keys.every(
                key =>
                    Object.prototype.hasOwnProperty.call(
                        q,
                        key
                    )
            )
        ){

            return keys.map(
                key => q[key]
            );
        }

    }


    if(
        q.options &&
        typeof q.options==="object"
    ){

        return Object.keys(
            q.options
        ).map(
            key => q.options[key]
        );

    }


    return [];
}


/* ============================================================
   CORRECT ANSWER NORMALIZER
   ============================================================ */

function normalizeCorrectIndex(
    q,
    options
){

    if(
        !q ||
        !options.length
    ){
        return -1;
    }


    const raw=
        firstValue(
            q,
            [
                "correct",
                "correctIndex",
                "correct_answer",
                "correctAnswer",
                "answerIndex",
                "rightAnswer"
            ]
        );


    /*
     * Existing JSON format:
     *
     * correct: 0
     * correct: 1
     * correct: 2
     * correct: 3
     *
     * इसलिए numeric value को 0-based ही रखा गया है.
     */

    if(
        typeof raw==="number" &&
        Number.isFinite(raw)
    ){

        const n=
            Math.trunc(raw);

        if(
            n>=0 &&
            n<options.length
        ){

            return n;
        }

    }


    const answerRaw=
        firstValue(
            q,
            [
                "answer",
                "correctAnswerText",
                "correct_option",
                "right_answer"
            ]
        );


    if(
        typeof answerRaw==="number" &&
        Number.isFinite(answerRaw)
    ){

        const n=
            Math.trunc(
                answerRaw
            );


        if(
            n>=0 &&
            n<options.length
        ){

            return n;
        }

        if(
            n>=1 &&
            n<=options.length
        ){

            return n-1;
        }
    }


    if(
        typeof raw==="string"
    ){

        const value=
            raw.trim();


        const letter=
            value
                .toUpperCase()
                .match(
                    /^[A-D]$/
                );


        if(letter){

            return (
                "ABCD".indexOf(
                    letter[0]
                )
            );
        }


        const numeric=
            Number(
                value
            );


        if(
            Number.isInteger(
                numeric
            )
        ){

            if(
                numeric>=0 &&
                numeric<options.length
            ){

                return numeric;
            }

            if(
                numeric>=1 &&
                numeric<=options.length
            ){

                return numeric-1;
            }
        }

    }


    if(
        answerRaw!==null &&
        answerRaw!==undefined
    ){

        const target=
            String(
                answerRaw
            )
            .trim();


        const index=
            options.findIndex(
                option =>
                    String(option)
                    .trim()===
                    target
            );


        if(index>=0){
            return index;
        }


        const normalizedTarget=
            target
                .replace(
                    /^\s*\([A-D]\)\s*/i,
                    ""
                )
                .trim()
                .toLowerCase();


        const normalizedIndex=
            options.findIndex(
                option =>
                    String(option)
                        .replace(
                            /^\s*\([A-D]\)\s*/i,
                            ""
                        )
                        .trim()
                        .toLowerCase()===
                    normalizedTarget
            );


        if(
            normalizedIndex>=0
        ){

            return normalizedIndex;
        }
    }


    return -1;
}


/* ============================================================
   QUESTION RECORD DETECTION
   ============================================================ */

function isQuestionRecord(obj){

    if(
        !obj ||
        typeof obj!=="object" ||
        Array.isArray(obj)
    ){

        return false;
    }


    const options=
        getOptions(
            obj
        );


    const text=
        getQuestionText(
            obj
        );


    return (
        options.length>0 &&
        String(text).trim()!==""
    );
}


/* ============================================================
   RECURSIVE QUESTION EXTRACTION
   ============================================================ */

function collectQuestions(
    node,
    output=[],
    parentSection=""
){

    if(
        node===null ||
        node===undefined
    ){

        return output;
    }


    if(Array.isArray(node)){

        node.forEach(
            item =>
                collectQuestions(
                    item,
                    output,
                    parentSection
                )
        );

        return output;
    }


    if(
        typeof node!=="object"
    ){

        return output;
    }


    /*
     * अगर यह actual question record है
     * तो सीधे add करो.
     */
    if(isQuestionRecord(node)){

        output.push({
            raw:node,
            sectionName:
                getSectionName(
                    node,
                    parentSection
                )
        });

        return output;
    }


    /*
     * Section name carry forward.
     */
    const currentSection=
        firstValue(
            node,
            [
                "section",
                "sectionName",
                "subject",
                "category",
                "topic"
            ]
        ) ||
        parentSection;


    /*
     * किसी भी nested "questions" array को
     * recursively process करो.
     */
    const nestedKeys=[
        "questions",
        "question",
        "items",
        "data",
        "sections",
        "subjects",
        "questionList",
        "allQuestions",
        "questionsData"
    ];


    let foundNested=false;


    for(
        const key of nestedKeys
    ){

        if(
            Object.prototype.hasOwnProperty.call(
                node,
                key
            )
        ){

            const value=
                node[key];


            if(
                Array.isArray(value) ||
                (
                    value &&
                    typeof value==="object"
                )
            ){

                foundNested=true;


                collectQuestions(
                    value,
                    output,
                    currentSection
                );
            }
        }
    }


    /*
     * कुछ MongoDB records में पूरा JSON
     * किसी दूसरे object के अंदर हो सकता है.
     */
    if(!foundNested){

        Object.keys(node)
            .forEach(
                key=>{

                    const value=
                        node[key];


                    if(
                        value &&
                        typeof value==="object"
                    ){

                        collectQuestions(
                            value,
                            output,
                            currentSection
                        );
                    }

                }
            );
    }


    return output;
}


/* ============================================================
   FINAL QUESTION NORMALIZATION
   ============================================================ */

function normalizeQuestions(
    testData
){

    const collected=
        collectQuestions(
            testData
        );


    return collected
        .map(
            (entry,index)=>{

                const q=
                    entry.raw;


                const options=
                    getOptions(
                        q
                    );


                const text=
                    getQuestionText(
                        q
                    );


                const correctIndex=
                    normalizeCorrectIndex(
                        q,
                        options
                    );


                return {

                    ...q,

                    id:
                        firstValue(
                            q,
                            [
                                "id",
                                "qid",
                                "questionId",
                                "number"
                            ]
                        ) ||
                        index+1,

                    question:
                        text,

                    text:
                        text,

                    options:
                        options,

                    correctIndex:
                        correctIndex,

                    answer:
                        correctIndex>=0
                            ? options[
                                correctIndex
                              ]
                            : firstValue(
                                q,
                                [
                                    "answer",
                                    "correctAnswer"
                                ]
                            ),

                    explanation:
                        getExplanation(
                            q
                        ),

                    img:
                        getImage(
                            q
                        ),

                    sectionName:
                        entry.sectionName

                };

            }
        )
        .filter(
            q =>
                String(
                    q.question
                ).trim()!=="" &&
                q.options.length>0
        );
}


/* ============================================================
   LOAD TEST
   ============================================================ */

window.onload=
async function(){

    if(
        window.Telegram &&
        window.Telegram.WebApp
    ){

        window.Telegram.WebApp.ready();
    }


    const params=
        new URLSearchParams(
            window.location.search
        );


    const testId=
        getCurrentTestId();


    const savedAnswers=
        params.get(
            "answers"
        );


    if(!testId){

        showError(
            "⚠️ अमान्य टेस्ट लिंक!",
            "Test ID नहीं मिली।"
        );

        return;
    }


    try{

        /*
         * SAME MongoDB METHOD.
         *
         * User जिस Test पर click करेगा,
         * वही Test ID यहाँ आएगी.
         *
         * /get_test/<clicked_test_id>
         */

        const response=
            await fetch(
                `${API_BASE_URL}/get_test/${encodeURIComponent(testId)}`,
                {
                    method:"GET",
                    cache:"no-store",
                    headers:{
                        "Accept":"application/json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Test not found: "+
                response.status
            );
        }


        const testData=
            await response.json();


        /*
         * अब JSON चाहे:
         *
         * {
         *   questions:[...]
         * }
         *
         * या:
         *
         * [
         *   {
         *     section:"GK",
         *     questions:[...]
         *   },
         *   {
         *     section:"Hindi",
         *     questions:[...]
         *   }
         * ]
         *
         * या multiple nested sections हो,
         * सभी questions recursively load होंगे.
         */

        questions=
            normalizeQuestions(
                testData
            );


        if(!questions.length){

            throw new Error(
                "Question records not found"
            );
        }


        /*
         * Metadata किसी भी level से.
         */
        const metadataSources=
            Array.isArray(
                testData
            )
                ? testData
                : [testData];


        const metadata=
            metadataSources.find(
                x =>
                    x &&
                    typeof x==="object"
            ) || {};


        positiveMark=
            Number(
                testData?.positive_mark ??
                testData?.positive ??
                testData?.pos ??
                metadata.positive_mark ??
                metadata.positive ??
                metadata.pos ??
                2
            );


        negativeMark=
            Number(
                testData?.negative_mark ??
                testData?.negative ??
                testData?.neg ??
                metadata.negative_mark ??
                metadata.negative ??
                metadata.neg ??
                .25
            );


        testCutoff=
            Number(
                testData?.cutoff ??
                metadata.cutoff ??
                35
            );


        const timeLimit=
            Number(
                testData?.time_limit ??
                testData?.time ??
                metadata.time_limit ??
                metadata.time ??
                15
            );


        time=
            Math.max(
                1,
                timeLimit
            )*60;


        /*
         * ALL QUESTIONS COUNT.
         */
        document.getElementById(
            "totalq"
        ).innerText=
            questions.length;


        answers=
            new Array(
                questions.length
            ).fill(null);


        status=
            new Array(
                questions.length
            ).fill(
                "notvisited"
            );


        /*
         * Submitted review.
         */
        if(savedAnswers){

            isReviewMode=
                true;

            submitted=
                true;


            let parsedAnswers=[];


            try{

                parsedAnswers=
                    JSON.parse(
                        savedAnswers
                    );

            }catch(e){

                parsedAnswers=[];
            }


            answers=
                questions.map(
                    (q,i)=>{

                        const value=
                            parsedAnswers[i];


                        return (
                            value===null ||
                            value===undefined ||
                            value===""
                        )
                            ? null
                            : Number(
                                value
                            );
                    }
                );


            document.getElementById(
                "top-title"
            ).innerText=
                "📊 Test Analysis";


            executeSubmit(
                true
            );


        }else{

            startTimer();

            loadQuestion();

        }


    }catch(error){

        console.error(
            "TEST LOAD ERROR:",
            error
        );


        showError(
            "⚠️ टेस्ट लोड नहीं हो सका",
            "MongoDB से इस Test का पूरा question data प्राप्त नहीं हुआ।"
        );
    }

};


/* ============================================================
   ERROR
   ============================================================ */

function showError(
    title,
    message
){

    document.getElementById(
        "timer"
    ).innerText=
        "ERR";


    document.getElementById(
        "totalq"
    ).innerText=
        "0";


    document.getElementById(
        "exam"
    ).innerHTML=

        <div style="
            margin:25px 15px;
            background:white;
            border-radius:14px;
            padding:25px 18px;
            text-align:center;
            box-shadow:0 4px 15px rgba(0,0,0,.08);
        ">

            <div style="
                font-size:50px;
                margin-bottom:12px;
            ">
                ⚠️
            </div>

            <h3 style="

                margin:0 0 12px;

            <button

                    color:white;

                    border-radius:8px;
                    font-weight:bold;
                "
            >

}


function escapeHTML(value){

    const div=
        document.createElement(
            "div"
        );

    div.textContent=
        String(
            value ??
            ""
        );

    return div.innerHTML;
}


/* ============================================================
   HTML / JSON CONTENT
   ============================================================ */

function renderSourceHTML(
    value
){

    if(
        value===null ||
        value===undefined
    ){

        return "";
    }


    const source=
        String(
            value
        );


    /*
     * Plain text को HTML की तरह
     * safely render करो.
     */
    const parser=
        new DOMParser();


    const doc=
        parser.parseFromString(
            source,
            "text/html"
        );


    /*
     * JSON में आने वाली style tags
     * भी preserve रहें.
     */
    doc
        .querySelectorAll(
            "style"
        )
        .forEach(
            style=>{

                const css=
                    style.textContent ||
                    "";


                if(
                    css.trim() &&
                    ![
                        ...document
                            .head
                            .querySelectorAll(
                                "style[data-source-json-style]"
                            )
                    ]
                    .some(
                        existing =>
                            existing.textContent===
                            css
                    )
                ){

                    const styleCopy=
                        document.createElement(
                            "style"
                        );


                    styleCopy.setAttribute(
                        "data-source-json-style",
                        "true"
                    );


                    styleCopy.textContent=
                        css;


                    document.head.appendChild(
                        styleCopy
                    );
                }
            }
        );


    const content=
        doc.body
            ? doc.body.innerHTML
            : source;


    const wrapper=
        document.createElement(
            "div"
        );


    wrapper.className=
        "notranslate";


    wrapper.setAttribute(
        "translate",
        "no"
    );


    wrapper.innerHTML=
        content;


    wrapper
        .querySelectorAll(
            "*"
        )
        .forEach(
            el=>{

                el.setAttribute(
                    "translate",
                    "no"
                );

                el.classList.add(
                    "notranslate"
                );

            }
        );


    return wrapper.innerHTML;
}


/* ============================================================
   QUESTION SCREEN
   ============================================================ */

function loadQuestion(){

    if(
        !questions.length
    ){

        return;
    }


    const q=
        questions[
            current
        ];


    const section=
        q.sectionName
            ? `
                <div class="section-name notranslate" translate="no">
                    📚 ${renderSourceHTML(q.sectionName)}
                </div>
              `
            : "";


    let html=
        "<div class='qcard notranslate' translate='no'>"+

        section+

        "<div class='qtitle'>"+
        "Q"+
        (current+1)+
        ". "+
        renderSourceHTML(
            q.question
        )+
        "</div>";


    if(
        q.img &&
        String(
            q.img
        ).trim()!==""
    ){

        html+=
            "<div style='text-align:center;padding:10px;'>"+
            "<img src='"+escapeAttribute(q.img)+"' "+
            "style='max-width:100%;height:auto;border-radius:8px;border:1px solid #ddd;'>"+
            "</div>";
    }


    q.options.forEach(
        (opt,i)=>{

            const isSelected=
                Number(
                    answers[current]
                )===
                Number(i)
                    ? "selected"
                    : "";


            html+=
                "<div class='option "+
                isSelected+
                " notranslate' translate='no' "+
                "onclick='selectOption(this,"+
                i+
                ")'>"+

                "<div class='circle'></div>"+

                "<div>"+
                renderSourceHTML(
                    opt
                )+
                "</div>"+

                "</div>";
        }
    );


    html+="</div>";


    document.getElementById(
        "exam"
    ).innerHTML=
        html;


    document.getElementById(
        "qno"
    ).innerText=
        current+1;


    updatePalette();


    window.scrollTo(
        0,
        0
    );
}


function escapeAttribute(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );
}


/* ============================================================
   ANSWER
   ============================================================ */

function selectOption(
    el,
    i
){

    if(submitted){
        return;
    }


    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            o =>
                o.classList.remove(
                    "selected"
                )
        );


    el.classList.add(
        "selected"
    );


    answers[current]=
        Number(i);


    status[current]=
        "answered";


    updatePalette();
}


/* ============================================================
   NAVIGATION
   ============================================================ */

function saveNext(){

    if(
        answers[current]===null &&
        status[current]!=="review"
    ){

        status[current]=
            "notanswered";
    }


    if(
        current<
        questions.length-1
    ){

        current++;

        loadQuestion();
    }
}


function previousQuestion(){

    if(current>0){

        current--;

        loadQuestion();
    }
}


function markReview(){

    status[current]=
        "review";


    if(
        current<
        questions.length-1
    ){

        current++;

        loadQuestion();

    }else{

        updatePalette();
    }
}


/* ============================================================
   PALETTE
   ============================================================ */

function togglePalette(){

    document
        .getElementById(
            "palette"
        )
        .classList.toggle(
            "active"
        );
}


function updatePalette(){

    let html="";


    questions.forEach(
        (q,i)=>{

            html+=
                "<button class='"+
                status[i]+
                "' onclick='goQ("+
                i+
                ")'>"+
                (i+1)+
                "</button>";
        }
    );


    document.getElementById(
        "palette-buttons"
    ).innerHTML=
        html;
}


function goQ(i){

    current=
        Number(i);


    loadQuestion();


    document
        .getElementById(
            "palette"
        )
        .classList.remove(
            "active"
        );
}


/* ============================================================
   SUBMIT
   ============================================================ */

function showSubmitConfirm(){

    if(submitted){
        return;
    }


    document.getElementById(
        "submit-confirm-modal"
    ).style.display=
        "flex";
}


function hideSubmitConfirm(){

    document.getElementById(
        "submit-confirm-modal"
    ).style.display=
        "none";
}


function executeSubmit(
    isFromHistory=false
){

    hideSubmitConfirm();


    if(
        submitted &&
        !isFromHistory
    ){

        return;
    }


    submitted=true;


    clearInterval(
        timerInterval
    );


    let correct=0;
    let incorrect=0;
    let unattempted=0;


    questions.forEach(
        (q,i)=>{

            const correctIndex=
                Number(
                    q.correctIndex
                );


            if(
                answers[i]===null ||
                answers[i]===undefined ||
                answers[i]===""
            ){

                unattempted++;

            }else if(
                Number(
                    answers[i]
                )===
                correctIndex
            ){

                correct++;

            }else{

                incorrect++;
            }

        }
    );


    const score=
        (
            correct*
            positiveMark
        )-
        (
            incorrect*
            negativeMark
        );


    const maxScore=
        questions.length*
        positiveMark;


    const accuracy=
        (
            correct/
            (
                correct+
                incorrect||
                1
            )*
            100
        ).toFixed(2);


    /*
     * SAME clicked Test ID submit.
     */
    if(!isReviewMode){

        const params=
            new URLSearchParams(
                window.location.search
            );


        const uid=
            params.get(
                "uid"
            );


        const name=
            params.get(
                "name"
            );


        const testId=
            getCurrentTestId();


        if(
            uid &&
            name &&
            testId
        ){

            fetch(
                `${API_BASE_URL}/submit_score`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                parseInt(
                                    uid
                                ),

                            first_name:
                                name,

                            test_id:
                                testId,

                            test_name:
                                "Mock Test",

                            score:
                                parseFloat(
                                    score
                                ),

                            accuracy:
                                parseFloat(
                                    accuracy
                                )

                        })
                }
            )
            .catch(
                error =>
                    console.error(
                        "Score save error:",
                        error
                    )
            );
        }
    }


    generateResultScreen(
        score,
        maxScore,
        correct,
        incorrect,
        unattempted,
        accuracy
    );
}


/* ============================================================
   RESULT + FULL SOLUTION
   ============================================================ */

function generateResultScreen(

    html+=

        "<span style='color:#e53935;font-size:24px;font-weight:bold;'>"+
        incorrect+

        "<span style='color:#ff9800;font-size:24px;font-weight:bold;'>"+
        unattempted+
        "</span><br><small>Skipped</small>"+
        "</div>"+

        "</div>"+

        accuracy+

        "<canvas id='chart'></canvas>"+
        "</div>"+

        "<h3 style='margin-top:30px;border-bottom:2px solid #ccc;padding-bottom:5px;'>"+

        "</h3>";


    questions.forEach(
        (q,i)=>{

            const userAns=
                answers[i];


            const correctIndex=
                Number(
                    q.correctIndex
                );


            let boxClass=
                "analysis-box";


            let statusText="";


            if(
                userAns===null ||
                userAns===undefined
            ){

                boxClass+=
                    " unattempted-box";


                statusText=
                    "<span style='color:#e65100;font-weight:bold;background:#ffe0b2;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "⚠️ Skipped ( 0 )"+
                    "</span>";

            }else if(
                Number(userAns)===
                correctIndex
            ){

                boxClass+=
                    " correct-box";


                statusText=
                    "<span style='color:#1b5e20;font-weight:bold;background:#c8e6c9;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "✅ Correct ( +"+
                    positiveMark+
                    " )"+
                    "</span>";

            }else{

                boxClass+=
                    " wrong-box";


                statusText=
                    "<span style='color:#b71c1c;font-weight:bold;background:#ffcdd2;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "❌ Wrong ( -"+
                    negativeMark+
                    " )"+
                    "</span>";
            }


            html+=
                "<div class='"+

                html+=

            html+=

                statusText+

                    "</div>";

                        icon="✅";

                    }else if(
                        userAns!==null &&
                        userAns!==undefined &&
                        Number(optIndex)===
                        Number(userAns)
                    ){

                        optStyle=
                            "padding:12px;margin-bottom:8px;border-radius:8px;border:2px solid #e53935;background:#ffebee;font-weight:bold;color:#c62828;line-height:1.5;";

                        icon="❌";
                    }


                    html+=
                        "<div class='notranslate' translate='no' style='"+
                        optStyle+
                        "'>"+
                        icon+
                        " "+
                        renderSourceHTML(
                            opt
                        )+
                        "</div>";

                }
            );


            html+=
                "</div>"+

                "<hr style='border:0;border-top:1px dashed #ccc;margin:20px 0 15px;'>"+

                "<div style='background:#f4f9ff;padding:15px;border-radius:10px;border:1px solid #d0e3ff;box-shadow:inset 0 2px 4px rgba(0,0,0,.02);'>"+

                        ? renderSourceHTML(

                )+

                "</div>"+

                "</div>";

        }
    );


    html+=
        `
        <div class="promo-banner notranslate" translate="no">

            <h3>

            <p>
                हमारे आधिकारिक टेलीग्राम चैनल से जुड़ें और हर दिन नए टेस्ट, स्टडी मटेरियल और अपडेट्स पाएं!
            </p>

            <a

                class="promo-btn"
            >

            </a>

        </div>
        `;


    document.getElementById(
        "result"
    ).innerHTML=
        html;


    new Chart(
        document.getElementById(
            "chart"
        ),
        {
            type:"doughnut",

            data:{
                labels:[

                    "Incorrect",
                    "Skipped"
