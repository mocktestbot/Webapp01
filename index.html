<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Premium Practice Mock</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0 0 90px;
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
    background:#f4f7f9;
    color:#252525;
}

.notranslate{
    translate:none!important;
}

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    min-height:64px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg,#00bff3,#008fd1);
    color:#fff;
    box-shadow:0 4px 18px rgba(0,0,0,.14);
}

.top-title{
    font-size:20px;
    font-weight:800;
    letter-spacing:.2px;
}

.timer-box{
    min-width:74px;
    text-align:center;
    padding:7px 12px;
    border-radius:25px;
    background:#fff;
    color:#e53935;
    font-size:17px;
    font-weight:900;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.qheader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 18px 10px;
    font-size:17px;
    font-weight:800;
}

.last{
    background:#ffebee;
    color:#e53935;
    border-radius:8px;
    padding:5px 9px;
    font-size:11px;
}

.qcard{
    margin:10px 16px 20px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
    border:1px solid #edf1f4;
}

.section-name{
    padding:12px 18px;
    background:linear-gradient(135deg,#e9faff,#f5fcff);
    color:#0088c8;
    font-size:14px;
    font-weight:800;
    border-bottom:1px solid #d7f2fb;
}

.qtitle{
    padding:20px 18px;
    font-size:18px;
    line-height:1.75;
    font-weight:700;
    color:#292929;
    background:#fff;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.qnumber{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:38px;
    height:30px;
    padding:0 9px;
    margin-bottom:12px;
    border-radius:8px;
    background:linear-gradient(135deg,#00bff3,#008fd1);
    color:#fff;
    font-size:13px;
    font-weight:900;
}

.question-text{
    display:block;
}

.question-text img,
.option-content img,
.explanation-content img,
.answer-value img{
    max-width:100%!important;
    height:auto!important;
    display:block;
    margin:8px auto;
    border-radius:8px;
}

.question-text table,
.option-content table,
.explanation-content table{
    max-width:100%;
    overflow:auto;
}

.question-text svg,
.option-content svg,
.explanation-content svg{
    max-width:100%;
    height:auto;
}

.option{
    display:flex;
    align-items:flex-start;
    gap:13px;
    padding:17px 16px;
    background:#fff;
    border-top:1px solid #f0f2f4;
    cursor:pointer;
    transition:.18s ease;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.option:active{
    transform:scale(.995);
}

.option-content{
    flex:1;
    min-width:0;
    font-size:16px;
    line-height:1.6;
}

.option-radio{
    width:22px;
    height:22px;
    min-width:22px;
    border:2px solid #11b5e4;
    border-radius:50%;
    position:relative;
    margin-top:2px;
    transition:.18s;
}

.option.selected{
    background:linear-gradient(90deg,#e1f8ff,#f8fdff);
}

.option.selected .option-radio{
    border:6px solid #11b5e4;
    box-shadow:0 0 0 2px rgba(17,181,228,.15);
}

.question-image{
    padding:0 18px 18px;
    text-align:center;
}

.question-image img{
    max-width:100%;
    height:auto;
    border-radius:12px;
    border:1px solid #e1e7eb;
}

/* BOTTOM BUTTONS */

.button-row{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1500;
    display:flex;
    align-items:center;
    justify-content:space-around;
    gap:6px;
    padding:10px 6px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.97);
    border-top:1px solid #e0e5e8;
    box-shadow:0 -6px 22px rgba(0,0,0,.08);
    backdrop-filter:blur(12px);
}

.action-btn{
    border:0;
    border-radius:11px;
    padding:12px 11px;
    color:#fff;
    background:#08b6e6;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
    transition:.18s;
}

.action-btn:active{
    transform:scale(.95);
}

.review-btn{
    background:#ff9800;
}

.submit-btn{
    background:#4caf50;
}

.float-btn{
    position:fixed;
    right:24px;
    bottom:105px;
    z-index:1200;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#00c3f3,#009bd4);
    color:#fff;
    font-size:29px;
    font-weight:900;
    box-shadow:0 8px 25px rgba(0,168,222,.35);
    cursor:pointer;
}

/* PALETTE */

.palette{
    position:fixed;
    top:0;
    right:-100%;
    z-index:2000;
    width:80%;
    max-width:340px;
    height:100%;
    padding:22px 15px;
    background:#fff;
    overflow:auto;
    box-shadow:-10px 0 35px rgba(0,0,0,.18);
    transition:.3s ease;
}

.palette.active{
    right:0;
}

.palette h3{
    margin:0 45px 18px 0;
    padding-bottom:13px;
    border-bottom:2px solid #edf0f2;
}

.close-palette{
    position:absolute;
    top:17px;
    right:16px;
    border:0;
    border-radius:8px;
    padding:7px 11px;
    background:#e53935;
    color:#fff;
    font-weight:900;
}

.palette button.question-btn{
    width:43px;
    height:43px;
    margin:5px;
    border:0;
    border-radius:9px;
    font-weight:900;
    cursor:pointer;
}

.notvisited{
    background:#e4e7e9;
    color:#555;
}

.answered{
    background:#4caf50;
    color:#fff;
}

.notanswered{
    background:#e53935;
    color:#fff;
}

.review{
    background:#ff9800;
    color:#fff;
}

/* LOADING / ERROR */

.loading-card,
.error-card{
    margin:25px 16px;
    padding:35px 20px;
    border-radius:20px;
    background:#fff;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.error-icon{
    font-size:55px;
    margin-bottom:10px;
}

.error-card h3{
    margin:0 0 12px;
    color:#e53935;
}

.error-card p{
    color:#555;
    line-height:1.7;
}

.retry-btn{
    border:0;
    border-radius:11px;
    padding:13px 28px;
    background:#08b6e6;
    color:#fff;
    font-size:15px;
    font-weight:800;
}

/* SUBMIT MODAL */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.68);
}

.modal-box{
    width:100%;
    max-width:360px;
    padding:25px;
    border-radius:20px;
    background:#fff;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.modal-box h3{
    margin:0 0 10px;
    color:#4caf50;
    font-size:23px;
}

.modal-box p{
    color:#555;
    line-height:1.6;
}

.modal-buttons{
    display:flex;
    gap:12px;
}

.modal-buttons button{
    flex:1;
    border:0;
    border-radius:10px;
    padding:12px;
    font-weight:800;
}

.cancel-btn{
    background:#e8eaec;
    color:#333;
}

.confirm-btn{
    background:#4caf50;
    color:#fff;
}

/* RESULT */

.result{
    display:none;
    padding:15px 15px 35px;
}

.result-summary{
    background:#fff;
    border-radius:22px;
    padding:22px 16px;
    box-shadow:0 8px 28px rgba(0,0,0,.07);
    text-align:center;
    margin-bottom:18px;
}

.score-title{
    font-size:14px;
    color:#777;
    font-weight:700;
}

.score-value{
    margin:5px 0 15px;
    font-size:34px;
    color:#008dcc;
    font-weight:900;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    padding:12px 5px;
    border-radius:12px;
    background:#f7f9fa;
}

.stat-number{
    display:block;
    font-size:22px;
    font-weight:900;
}

.stat-label{
    font-size:11px;
    color:#777;
    font-weight:700;
}

.correct-stat .stat-number{
    color:#4caf50;
}

.wrong-stat .stat-number{
    color:#e53935;
}

.skip-stat .stat-number{

}

.chart-wrap{
    width:210px;
    margin:15px auto 5px;
}

.pass-banner{
    margin:15px 0;
    padding:14px;
    border-radius:14px;
    background:#e8f5e9;
    border:1px solid #a5d6a7;
    color:#2e7d32;
    text-align:center;
    font-weight:800;
}

.fail-banner{
    margin:15px 0;
    padding:14px;
    border-radius:14px;
    background:#ffebee;
    border:1px solid #ef9a9a;
    color:#c62828;
    text-align:center;
    font-weight:800;
}

/* FULL SOLUTION BUTTON */

.full-solution-btn{
    width:100%;
    margin-top:18px;
    border:0;
    border-radius:14px;
    padding:15px 18px;
    background:linear-gradient(135deg,#00bff3,#008fd1);
    color:#fff;
    font-size:16px;
    font-weight:900;
    box-shadow:0 6px 18px rgba(0,150,210,.22);
    cursor:pointer;
}

.full-solution-btn:active{
    transform:scale(.98);
}

/* SOLUTION */

.solution-section{
    margin-top:5px;
}

.solution-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.solution-heading h3{
    margin:0;
    font-size:19px;
}

.solution-counter{
    padding:6px 10px;
    border-radius:8px;
    background:#e9f8fd;
    color:#008dcc;
    font-size:12px;
    font-weight:900;
}

.solution-card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.07);
    border:1px solid #e9edef;
}

.solution-top{
    padding:14px 16px;
    background:linear-gradient(135deg,#00bff3,#008fd1);
    color:#fff;
}

.solution-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.solution-question-number{
    font-size:16px;
    font-weight:900;
}

.solution-status{
    padding:5px 9px;
    border-radius:7px;
    background:rgba(255,255,255,.2);
    font-size:11px;
    font-weight:900;
}

.solution-body{
    padding:18px 16px;
}

.solution-question{
    font-size:17px;
    line-height:1.7;
    font-weight:750;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.solution-option{
    padding:13px;
    margin:9px 0;
    border-radius:11px;
    border:1px solid #e8ebed;
    background:#fafbfc;
    line-height:1.55;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.solution-option.correct{
    background:#e8f5e9;
    border:2px solid #4caf50;
    color:#1b5e20;
}

.solution-option.wrong{
    background:#ffebee;
    border:2px solid #e53935;
    color:#b71c1c;
}

.solution-option-prefix{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:27px;
    height:27px;
    margin-right:7px;
    border-radius:50%;
    background:#edf0f2;
    font-size:12px;
    font-weight:900;
}

.solution-option.correct .solution-option-prefix{
    background:#4caf50;
    color:#fff;
}

.solution-option.wrong .solution-option-prefix{
    background:#e53935;
    color:#fff;
}

.answer-box{
    margin-top:17px;
    padding:14px;
    border-radius:12px;
    background:#f7fbff;
    border:1px solid #d7ebf7;
}

.answer-label{
    color:#008dcc;
    font-size:12px;
    font-weight:900;
    margin-bottom:7px;
}

.answer-value{
    line-height:1.6;
    font-weight:750;
}

.explanation-box{
    margin-top:14px;
    padding:15px;
    border-radius:13px;
    background:linear-gradient(135deg,#fffdf4,#fff8df);
    border:1px solid #ffe39a;
}

.explanation-title{
    display:inline-block;
    margin-bottom:10px;
    padding:6px 10px;
    border-radius:7px;
    background:#ffb300;
    color:#fff;
    font-size:12px;
    font-weight:900;
}

.explanation-content{
    color:#444;
    font-size:14px;
    line-height:1.7;
    overflow-wrap:anywhere;
    word-break:break-word;
}

/* SOLUTION NAVIGATION */

.solution-navigation{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:14px;
}

.solution-nav-btn{
    flex:1;
    border:0;
    border-radius:12px;
    padding:13px 10px;
    color:#fff;
    background:#08b6e6;
    font-size:14px;
    font-weight:900;
    box-shadow:0 5px 12px rgba(0,0,0,.08);
}

.solution-nav-btn:disabled{
    opacity:.4;
}

.solution-middle{
    min-width:65px;
    text-align:center;
    color:#777;
    font-size:12px;
    font-weight:800;
}

/* BACK TO SCORECARD */

.back-scorecard-btn{
    width:100%;
    margin-bottom:15px;
    border:0;
    border-radius:13px;
    padding:14px 18px;
    background:#fff;
    color:#008dcc;
    border:2px solid #08b6e6;
    font-size:15px;
    font-weight:900;
    cursor:pointer;

/* PROMO */

.promo-banner{
    margin-top:22px;
    padding:20px 16px;
    border-radius:18px;
    background:linear-gradient(135deg,#673ab7,#512da8);
    color:#fff;
    text-align:center;
    box-shadow:0 8px 25px rgba(81,45,168,.22);
}

.promo-banner h3{
    margin:0 0 8px;
}

.promo-banner p{

    color:#e8ddff;

    line-height:1.6;
}

.promo-btn{
    display:inline-block;
    padding:12px 22px;
    border-radius:25px;
    background:#ff9800;
    color:#fff;

/* MOBILE */

@media(max-width:420px){

<script>
"use strict";


/* ============================================================
   GLOBAL STATE
============================================================ */

let questions = [];
let current = 0;

let answers = [];
let status = [];

let submitted = false;

let time = 0;
let timerInterval = null;

let positiveMark = 2;
let negativeMark = .25;
let testCutoff = 35;

let currentTestData = null;
let currentTestId = "";

let solutionCurrent = 0;

let sourceStylesLoaded = new Set();


const API_BASE_URL =
    "https://mock-bot-l091.onrender.com";


/* ============================================================
   HELPER
============================================================ */

function $(id){
    return document.getElementById(id);
}


function firstValue(obj,keys){

    if(
        !obj ||
        typeof obj !== "object"
    ){
        return "";
    }

    for(
        const key of keys
    ){

        if(
            Object.prototype.hasOwnProperty.call(
                obj,
                key
            ) &&
            obj[key] !== null &&
            obj[key] !== undefined &&
            String(obj[key]).trim() !== ""
        ){

            return obj[key];
        }
    }

    return "";
}


function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        String(value ?? "");

    return div.innerHTML;
}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


/* ============================================================
   TEST ID
============================================================ */

function getCurrentTestId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        (
            params.get("test_id") ||
            params.get("testId") ||
            params.get("id") ||
            ""
        ).trim();


    if(id){

        sessionStorage.setItem(
            "currentTestId",
            id
        );

        return id;
    }


    return (
        sessionStorage.getItem(
            "currentTestId"
        ) || ""
    ).trim();
}


/* ============================================================
   QUESTION TEXT
============================================================ */

function getQuestionText(q){

    return firstValue(
        q,
        [
            "question",
            "question_text",
            "questionText",
            "question_title",
            "questionTitle",
            "text",
            "questionName",
            "title",
            "q"
        ]
    );
}


/* ============================================================
   EXPLANATION
============================================================ */

function getExplanation(q){

    return firstValue(
        q,
        [
            "exp",
            "explanation",
            "solution",
            "solution_text",
            "solutionText",
            "answer_explanation",
            "answerExplanation",
            "description"
        ]
    );
}


/* ============================================================
   IMAGE
============================================================ */

function getQuestionImage(q){

    return firstValue(
        q,
        [
            "img",
            "image",
            "image_link",
            "imageLink",
            "image_url",
            "imageUrl",
            "question_image",
            "questionImage"
        ]
    );
}


/* ============================================================
   SECTION
============================================================ */

function getSectionName(
    q,
    parentSection=""
){

    return firstValue(
        q,
        [
            "sectionName",
            "section",
            "subject",
            "category",
            "topic"
        ]
    ) || parentSection || "";
}


/* ============================================================
   OPTIONS
============================================================ */

function getOptions(q){

    if(
        !q ||
        typeof q !== "object"
    ){
        return [];
    }


    if(
        Array.isArray(q.options)
    ){

        return q.options;
    }


    const arrayKeys = [
        "choices",
        "answers",
        "option",
        "optionsData",
        "optionList"
    ];


    for(
        const key of arrayKeys
    ){

        if(
            Array.isArray(q[key])
        ){

            return q[key];
        }
    }


    const keySets = [

        ["A","B","C","D"],

        ["a","b","c","d"],

        [
            "optionA",
            "optionB",
            "optionC",
            "optionD"
        ],

        [
            "option_a",
            "option_b",
            "option_c",
            "option_d"
        ],

        [
            "option1",
            "option2",
            "option3",
            "option4"
        ]

    ];


    for(
        const keys of keySets
    ){

        if(
            keys.every(
                key =>
                    Object.prototype.hasOwnProperty.call(
                        q,
                        key
                    )
            )
        ){

            return keys.map(
                key => q[key]
            );
        }
    }


    if(
        q.options &&
        typeof q.options === "object" &&
        !Array.isArray(q.options)
    ){

        return Object.keys(q.options)
            .sort()
            .map(
                key => q.options[key]
            );
    }


    return [];
}


/* ============================================================
   CORRECT ANSWER
============================================================ */

function normalizeCorrectIndex(
    q,
    options
){

    if(
        !q ||
        !options.length
    ){

        return -1;
    }


    const raw =
        firstValue(
            q,
            [
                "correct",
                "correctIndex",
                "answerIndex",
                "correct_answer",
                "correctAnswer",
                "rightAnswer",
                "right_answer"
            ]
        );


    if(
        typeof raw === "number" &&
        Number.isFinite(raw)
    ){

        const n =
            Math.trunc(raw);


        if(
            n >= 0 &&
            n < options.length
        ){

            return n;
        }


        if(
            n >= 1 &&
            n <= options.length
        ){

            return n - 1;
        }
    }


    if(
        typeof raw === "string"
    ){

        const value =
            raw.trim();


        const letter =
            value
                .toUpperCase()
                .match(/^[A-Z]$/);


        if(letter){

            const index =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                    .indexOf(
                        letter[0]
                    );


            if(
                index >= 0 &&
                index < options.length
            ){

                return index;
            }
        }


        const numeric =
            Number(value);


        if(
            Number.isInteger(numeric)
        ){

            if(
                numeric >= 0 &&
                numeric < options.length
            ){

                return numeric;
            }


            if(
                numeric >= 1 &&
                numeric <= options.length
            ){

                return numeric - 1;
            }
        }
    }


    const answerRaw =
        firstValue(
            q,
            [
                "answer",
                "correctAnswerText",
                "correct_option",
                "correctOption",
                "right_answer_text"
            ]
        );


    if(
        answerRaw !== null &&
        answerRaw !== undefined &&
        String(answerRaw).trim() !== ""
    ){

        const target =
            plainText(answerRaw)
                .trim()
                .toLowerCase();


        const index =
            options.findIndex(
                option =>
                    plainText(option)
                        .trim()
                        .toLowerCase() ===
                    target
            );


        if(index >= 0){

            return index;
        }
    }


    return -1;
}


/* ============================================================
   QUESTION RECORD
============================================================ */

function isQuestionRecord(obj){

    if(
        !obj ||
        typeof obj !== "object" ||
        Array.isArray(obj)
    ){

        return false;
    }


    return (
        String(
            getQuestionText(obj)
        ).trim() !== "" &&
        getOptions(obj).length > 0
    );
}


/* ============================================================
   RECURSIVE QUESTION COLLECTOR
============================================================ */

function collectQuestions(
    node,
    output=[],
    parentSection=""
){

    if(
        node === null ||
        node === undefined
    ){

        return output;
    }


    if(Array.isArray(node)){

        node.forEach(
            item =>
                collectQuestions(
                    item,
                    output,
                    parentSection
                )
        );

        return output;
    }


    if(typeof node !== "object"){

        return output;
    }


    if(isQuestionRecord(node)){

        output.push({

            raw:node,

            sectionName:
                getSectionName(
                    node,
                    parentSection
                )

        });

        return output;
    }


    const currentSection =
        getSectionName(
            node,
            parentSection
        );


    Object.keys(node).forEach(
        key => {

            const value =
                node[key];


            if(
                value &&
                typeof value === "object"
            ){

                collectQuestions(
                    value,
                    output,
                    currentSection
                );
            }

        }
    );


    return output;
}


/* ============================================================
   NORMALIZE QUESTIONS
============================================================ */

function normalizeQuestions(
    testData
){

    const collected =
        collectQuestions(
            testData
        );


    return collected
        .map(
            (entry,index) => {

                const q =
                    entry.raw;


                const options =
                    getOptions(q);


                const correctIndex =
                    normalizeCorrectIndex(
                        q,
                        options
                    );


                return {

                    ...q,

                    id:
                        firstValue(
                            q,
                            [
                                "id",
                                "qid",
                                "questionId",
                                "number"
                            ]
                        ) ||
                        index+1,

                    question:
                        getQuestionText(q),

                    options,

                    correctIndex,

                    answer:
                        correctIndex >= 0
                            ? options[correctIndex]
                            : firstValue(
                                q,
                                [
                                    "answer",
                                    "correctAnswer"
                                ]
                            ),

                    explanation:
                        getExplanation(q),

                    img:
                        getQuestionImage(q),

                    sectionName:
                        entry.sectionName
                };
            }
        )
        .filter(
            q =>
                String(
                    q.question
                ).trim() !== "" &&
                q.options.length > 0
        );
}


/* ============================================================
   PLAIN TEXT
============================================================ */

function plainText(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";
    }


    const source =
        String(value);


    if(!source.trim()){

        return "";
    }


    const parser =
        new DOMParser();


    const doc =
        parser.parseFromString(
            source,
            "text/html"
        );


    doc
        .querySelectorAll(
            "script,style,noscript,template"
        )
        .forEach(
            el => el.remove()
        );


    return (
        doc.body
            ? doc.body.textContent
            : source
    )
    .replace(
        /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,
        ""
    )
    .replace(
        /\s+/g,
        " "
    )
    .trim();
}


/* ============================================================
   RICH HTML
============================================================ */

function rich(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";
    }


    const source =
        String(value);


    if(!source.trim()){

        return "";
    }


    const parser =
        new DOMParser();


    const doc =
        parser.parseFromString(
            source,
            "text/html"
        );


    doc
        .querySelectorAll("style")
        .forEach(
            style => {

                const css =
                    style.textContent || "";


                const key =
                    css.trim();


                if(
                    key &&
                    !sourceStylesLoaded.has(
                        key
                    )
                ){

                    sourceStylesLoaded.add(
                        key
                    );


                    const newStyle =
                        document.createElement(
                            "style"
                        );


                    newStyle.dataset.jsonStyle =
                        "true";


                    newStyle.textContent =
                        css;


                    document.head.appendChild(
                        newStyle
                    );
                }
            }
        );


    doc
        .querySelectorAll(
            "script,noscript,template,head,meta,link,title"
        )
        .forEach(
            el => el.remove()
        );


    doc
        .querySelectorAll("*")
        .forEach(
            el => {

                [
                    ...el.attributes
                ].forEach(
                    attr => {

                        const name =
                            attr.name.toLowerCase();


                        if(
                            name.startsWith("on") ||
                            name === "srcdoc"
                        ){

                            el.removeAttribute(
                                attr.name
                            );
                        }


                        if(
                            name === "href" ||
                            name === "src"
                        ){

                            const val =
                                String(
                                    attr.value
                                )
                                .trim()
                                .toLowerCase();


                            if(
                                val.startsWith(
                                    "javascript:"
                                )
                            ){

                                el.removeAttribute(
                                    attr.name
                                );
                            }
                        }

                    }
                );

            }
        );


    const bodyHTML =
        doc.body
            ? doc.body.innerHTML
            : source;


    return `
        <div
            class="source-content notranslate"
            translate="no"
        >
            ${bodyHTML}
        </div>
    `;
}

/* ============================================================
   TEST DATA LOAD
============================================================ */

async function loadTestData(){

    const errors = [];


    /*
       IMPORTANT:

       User जिस Test ID से test open करता है,
       वही ID MongoDB API को भेजी जाती है.
    */

    if(currentTestId){

        try{

            const response =
                await fetch(
                    `${API_BASE_URL}/get_test/${encodeURIComponent(currentTestId)}?t=${Date.now()}`,
                    {
                        method:"GET",
                        cache:"no-store",
                        headers:{
                            Accept:"application/json"
                        }
                    }
                );


            if(response.ok){

                const data =
                    await response.json();


                const apiQuestions =
                    normalizeQuestions(
                        data
                    );


                if(
                    apiQuestions.length > 0
                ){

                    return data;
                }


                errors.push(
                    "MongoDB data में readable questions नहीं मिले"
                );

            }else{

                errors.push(
                    "MongoDB HTTP "+
                    response.status
                );
            }


        }catch(error){

            console.error(
                "MongoDB error:",
                error
            );


            errors.push(
                "MongoDB: "+
                error.message
            );
        }
    }


    /*
       MongoDB unavailable होने पर
       same-folder 05.json fallback रहेगा.
    */

    try{

        const localData =
            await loadJSONFile();


        const localQuestions =
            normalizeQuestions(
                localData
            );


        if(
            localQuestions.length > 0
        ){

            return localData;
        }


        errors.push(
            "05.json में readable questions नहीं मिले"
        );


    }catch(error){

        console.error(
            "05.json error:",
            error
        );


        errors.push(
            "05.json: "+
            error.message
        );
    }


    throw new Error(
        errors.join(" | ")
    );
}


/* ============================================================
   NUMBER SETTING
============================================================ */

function getNumberSetting(
    data,
    keys,
    fallback
){

    const direct =
        firstValue(
            data,
            keys
        );


    if(
        direct !== "" &&
        Number.isFinite(
            Number(direct)
        )
    ){

        return Number(direct);
    }


    if(Array.isArray(data)){

        for(
            const item of data
        ){

            const value =
                firstValue(
                    item,
                    keys
                );


            if(
                value !== "" &&
                Number.isFinite(
                    Number(value)
                )
            ){

                return Number(value);
            }
        }
    }


    return fallback;
}


/* ============================================================
   TEST TIME
============================================================ */

function getTestTime(data){

    const direct =
        firstValue(
            data,
            [
                "time_limit",
                "timeLimit",
                "duration",
                "duration_minutes",
                "total_time",
                "totalTime"
            ]
        );


    if(
        direct !== "" &&
        Number(direct) > 0
    ){

        return Number(direct);
    }


    if(
        Array.isArray(data) &&
        data.length
    ){

        const section =
            data.find(
                x =>
                    x &&
                    typeof x === "object"
            );


        const sectionTime =
            Number(
                section?.time
            );


        if(
            Number.isFinite(
                sectionTime
            ) &&
            sectionTime > 0
        ){

            return sectionTime;
        }
    }


    return 60;
}

/* ============================================================
   TIMER
============================================================ */

function startTimer(){

    clearInterval(
        timerInterval
    );


    updateTimerUI();


    timerInterval =
        setInterval(
            function(){

                time--;

                updateTimerUI();


                if(
                    time <= 0
                ){

                    clearInterval(
                        timerInterval
                    );


                    executeSubmit();
                }

            },
            1000
        );
}


function updateTimerUI(){

    const safeTime =
        Math.max(
            0,
            time
        );


    const minutes =
        Math.floor(
            safeTime / 60
        );


    const seconds =
        safeTime % 60;


    $("timer").innerText =
        String(minutes)
            .padStart(2,"0")+
        ":"+
        String(seconds)
            .padStart(2,"0");


    $("lastMin").innerText =
        "Last "+
        String(minutes)
            .padStart(2,"0")+
        " Mins";


    if(
        safeTime <= 60
    ){

        $("timer").style.color =
            "#e53935";
    }
}


/* ============================================================
   LOAD QUESTION
============================================================ */

function loadQuestion(){

    if(
        !questions.length
    ){

        return;
    }


    current =
        Math.max(
            0,
            Math.min(
                current,
                questions.length-1
            )
        );


    const q =
        questions[current];


    let html = `

        <div
            class="qcard notranslate"
            translate="no"
        >

    `;


    if(
        q.sectionName &&
        String(
            q.sectionName
        ).trim()
    ){

        html += `

            <div class="section-name">
                📚 ${rich(q.sectionName)}
            </div>

        `;
    }


    html += `

        <div class="qtitle">

            <span class="qnumber">
                Q${current+1}
            </span>

            <span class="question-text">
                ${rich(q.question)}
            </span>

        </div>

    `;


    if(
        q.img &&
        String(q.img).trim()
    ){

        html += `

            <div class="question-image">

                <img
                    src="${escapeAttribute(q.img)}"
                    alt="Question Image"
                >

            </div>

        `;
    }


    q.options.forEach(
        (option,index) => {

            /*
               IMPORTANT FIX:
               null को Number(null)=0
               नहीं बनाया जाएगा.
            */

            const isSelected =
                answers[current] !== null &&
                answers[current] !== undefined &&
                answers[current] !== "" &&
                Number(
                    answers[current]
                ) === index;


            html += `

                <div
                    class="option notranslate ${isSelected ? "selected" : ""}"
                    translate="no"
                    onclick="selectOption(this,${index})"
                >

                    <div class="option-radio"></div>

                    <div class="option-content">
                        ${rich(option)}
                    </div>

                </div>

            `;
        }
    );


    html += `
        </div>
    `;


    $("exam").innerHTML =
        html;


    $("qno").innerText =
        current+1;


    updatePalette();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ============================================================
   SELECT OPTION
============================================================ */

function selectOption(
    element,
    index
){

    if(submitted){

        return;
    }


    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            option =>
                option.classList.remove(
                    "selected"
                )
        );


    element.classList.add(
        "selected"
    );


    answers[current] =
        Number(index);


    status[current] =
        "answered";


    updatePalette();
}


/* ============================================================
   SAVE NEXT
============================================================ */

function saveNext(){

    if(
        answers[current] === null ||
        answers[current] === undefined
    ){

        if(
            status[current] !== "review"
        ){

            status[current] =
                "notanswered";
        }
    }


    if(
        current <
        questions.length-1
    ){

        current++;

        loadQuestion();

    }else{

        updatePalette();
    }
}


/* ============================================================
   PREVIOUS
============================================================ */

function previousQuestion(){

    if(
        current > 0
    ){

        current--;

        loadQuestion();
    }
}


/* ============================================================
   REVIEW
============================================================ */

function markReview(){

    status[current] =
        "review";


    if(
        current <
        questions.length-1
    ){

        current++;

        loadQuestion();

    }else{

}

    index =

        index < 0 ||

        return;

    current =

   SUBMIT MODAL
============================================================ */

function showSubmitConfirm(){

    if(submitted){

        return;
    }

/* ============================================================
   SUBMIT TEST
============================================================ */

function executeSubmit(){

    if(submitted){

        return;
    }


    hideSubmitConfirm();


    submitted = true;


    clearInterval(
        timerInterval
    );


    let correct = 0;
    let incorrect = 0;
    let unattempted = 0;


    questions.forEach(
        (q,index) => {

            const userAnswer =
                answers[index];


            if(
                userAnswer === null ||
                userAnswer === undefined ||
                userAnswer === ""
            ){

                unattempted++;

            }else if(
                Number(userAnswer) ===
                Number(q.correctIndex)
            ){

                correct++;

            }else{

                incorrect++;
            }
        }
    );


    const score =
        (
            correct *
            positiveMark
        ) -
        (
            incorrect *
            negativeMark
        );


    const maxScore =
        questions.length *
        positiveMark;


    const accuracy =
        (
            correct /
            (
                correct +
                incorrect ||
                1
            )
            *
            100
        ).toFixed(2);


    submitScoreToBackend(
        score,
        accuracy
    );


    generateResultScreen(
        score,
        maxScore,
        correct,
        incorrect,
        unattempted,
        accuracy
    );
}

                            parseFloat(
                                score
                            ),

                        accuracy:
                            parseFloat(
                                accuracy
                            )

                    })
            }
        );

    }catch(error){

        console.error(
            "Score submit error:",
            error
        );
    }
}


/* ============================================================
   RESULT SCREEN
   पहले केवल SCORECARD दिखेगा.
   Solution तभी खुलेगा जब user
   Full Solution button दबाएगा.
============================================================ */

function generateResultScreen(
    score,
    maxScore,
    correct,
    incorrect,
    unattempted,
    accuracy
){

    $("timer").style.display =
        "none";


    $("question-header").style.display =
        "none";


    $("top-btn-row").style.display =
        "none";


    $("menu-float-btn").style.display =
        "none";


    $("exam").style.display =
        "none";


    $("palette").style.display =
        "none";


    $("result").style.display =
        "block";


    const passed =
        score >= testCutoff;


    $("result").innerHTML = `

        <!-- SCORECARD -->

        <div
            id="scorecard-view"
            class="notranslate"
            translate="no"
        >

            <div class="result-summary">

                <div class="score-title">
                    YOUR FINAL SCORE
                </div>


                <div class="score-value">

                    ${score.toFixed(2)}
                    /
                    ${maxScore}

                </div>


                <div class="stats-grid">

                    <div class="stat correct-stat">

                        <span class="stat-number">
                            ${correct}
                        </span>

                        <span class="stat-label">
                            Correct
                        </span>

                    </div>


                    <div class="stat wrong-stat">

                        <span class="stat-number">
                            ${incorrect}
                        </span>

                        <span class="stat-label">
                            Wrong
                        </span>

                    </div>


                    <div class="stat skip-stat">

                        <span class="stat-number">
                            ${unattempted}
                        </span>

                        <span class="stat-label">
                            Skipped
                        </span>

                    </div>

                </div>


                <div class="chart-wrap">

                    <canvas
                        id="resultChart"
                    ></canvas>

                </div>


                ${
                    passed
                    ?
                    `
                    <div class="pass-banner">
                        🎉 शानदार! आपने ${testCutoff} की कट-ऑफ पार कर ली।
                    </div>
                    `
                    :
                    `
                    <div class="fail-banner">
                        ⚠️ स्कोर ${testCutoff} की कट-ऑफ से कम है।
                        फिर से अभ्यास करें।
                    </div>
                    `
                }


                <div
                    style="
                        color:#777;
                        font-size:13px;
                        font-weight:700;
                    "
                >

                    Accuracy :

                    <strong
                        style="color:#008dcc"
                    >
                        ${accuracy}%
                    </strong>

                </div>


                <!-- FULL SOLUTION BUTTON -->

                <button
                    class="full-solution-btn"
                    onclick="openFullSolution()"
                >
                    📖 Full Solution देखें
                </button>

            </div>


            <div class="promo-banner">

                <h3>
                    🚀 और नए Mock Tests चाहिए?
                </h3>

                <p>
                    नए टेस्ट, स्टडी मटेरियल और अपडेट्स के लिए हमारे Telegram Channel से जुड़ें।
                </p>

                <a
                    href="https://t.me/+bmzuj2Y68nFmYTc9"
                    class="promo-btn"
                >
                    📢 अभी Channel Join करें
                </a>

            </div>

        </div>


        <!-- FULL SOLUTION VIEW -->

        <div
            id="solution-view"
            class="notranslate"
            translate="no"
            style="display:none"
        >

            <button
                class="back-scorecard-btn"
                onclick="showScorecard()"
            >
                ← Scorecard पर वापस जाएँ
            </button>


            <div class="solution-section">

                <div class="solution-heading">

                    <h3>
                        📖 Complete Solution
                    </h3>


                    <div
                        class="solution-counter"
                        id="solution-counter"
                    >
                        1 / ${questions.length}
                    </div>

                </div>


                <div
                    id="solution-container"
                ></div>


                <div
                    class="solution-navigation"
                >

                    <button
                        class="solution-nav-btn"
                        id="solution-prev"
                        onclick="previousSolution()"
                    >
                        ← Previous
                    </button>


                    <div
                        class="solution-middle"
                        id="solution-middle"
                    >
                        1 / ${questions.length}
                    </div>


                    <button
                        class="solution-nav-btn"
                        id="solution-next"
                        onclick="nextSolution()"
                    >
                        Next →
                    </button>

                </div>

            </div>

        </div>

    `;


    solutionCurrent = 0;


    /*
       Chart केवल scorecard में बनाया जाएगा.
    */

    const canvas =
        $("resultChart");


    if(canvas){

        new Chart(
            canvas,
            {
                type:"doughnut",

                data:{
                    labels:[
                        "Correct",
                        "Wrong",
                        "Skipped"
                    ],

                    datasets:[
                        {
                            data:[
                                correct,
                                incorrect,
                                unattempted
                            ]
                        }
                    ]
                },

                options:{
                    responsive:true,

                    plugins:{
                        legend:{
                            position:"bottom"
                        }
                    }
                }
            }
        );
    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ============================================================
   OPEN FULL SOLUTION
============================================================ */

function openFullSolution(){

    const scorecard =
        $("scorecard-view");


    const solution =
        $("solution-view");


    if(
        !scorecard ||
        !solution
    ){

        return;
    }


    scorecard.style.display =
        "none";


    solution.style.display =
        "block";


    solutionCurrent = 0;


    renderSolution();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ============================================================
   BACK TO SCORECARD
============================================================ */

function showScorecard(){

    const scorecard =
        $("scorecard-view");


    const solution =
        $("solution-view");


    if(
        !scorecard ||
        !solution
    ){

        return;
    }


    solution.style.display =
        "none";


    scorecard.style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ============================================================
   RENDER SOLUTION
============================================================ */

function renderSolution(){

    if(
        !questions.length
    ){

        return;
    }


    solutionCurrent =
        Math.max(
            0,
            Math.min(
                solutionCurrent,
                questions.length-1
            )
        );


    const q =
        questions[
            solutionCurrent
        ];


    const userAnswer =
        answers[
            solutionCurrent
        ];


    const correctIndex =
        Number(
            q.correctIndex
        );


    const isSkipped =
        userAnswer === null ||
        userAnswer === undefined ||
        userAnswer === "";


    const isCorrect =
        !isSkipped &&
        Number(userAnswer) ===
        correctIndex;


    let statusText =
        "⚠️ Skipped";


    if(isCorrect){

        statusText =
            "✅ Correct";

    }else if(!isSkipped){

        statusText =
            "❌ Wrong";
    }


    let optionsHTML = "";


    q.options.forEach(
        (option,index) => {

            const isAnswer =
                index === correctIndex;


            const isUserWrong =
                !isSkipped &&
                Number(userAnswer) === index &&
                !isAnswer;


            let className =
                "solution-option";


            let icon =
                "○";


            if(isAnswer){

                className +=
                    " correct";

                icon =
                    "✓";

            }else if(isUserWrong){

                className +=
                    " wrong";

                icon =
                    "✕";
            }


            optionsHTML += `

                <div
                    class="${className} notranslate"
                    translate="no"
                >

                    <span
                        class="solution-option-prefix"
                    >
                        ${icon}
                    </span>

                    ${rich(option)}

                </div>

            `;
        }
    );


    let answerHTML;


    if(
        correctIndex >= 0 &&
        q.options[correctIndex] !== undefined
    ){

        answerHTML = `

            <div class="answer-label">
                ✅ सही उत्तर
            </div>

            <div
                class="answer-value notranslate"
                translate="no"
            >
                ${rich(
                    q.options[correctIndex]
                )}
            </div>

        `;

    }else{

        answerHTML = `

            <div class="answer-label">
                ⚠️ सही उत्तर
            </div>

            <div class="answer-value">
                सही उत्तर उपलब्ध नहीं है।
            </div>

        `;
    }


    const explanation =
        q.explanation &&
        String(
            q.explanation
        ).trim()
            ? rich(
                q.explanation
              )
            :
              `
                <span style="color:#888">
                    इस प्रश्न की explanation JSON में उपलब्ध नहीं है।
                </span>
              `;


    $("solution-container").innerHTML = `

        <div
            class="solution-card notranslate"
            translate="no"
        >

            <div class="solution-top">

                <div class="solution-top-row">

                    <div
                        class="solution-question-number"
                    >
                        Q${solutionCurrent+1}
                    </div>


                    <div
                        class="solution-status"
                    >
                        ${statusText}
                    </div>

                </div>

            </div>


            <div class="solution-body">


                ${
                    q.sectionName &&
                    String(
                        q.sectionName
                    ).trim()
                    ?
                    `
                    <div
                        style="
                            display:inline-block;
                            margin-bottom:12px;
                            padding:6px 10px;
                            border-radius:7px;
                            background:#e9f8fd;
                            color:#008dcc;
                            font-size:11px;
                            font-weight:900;
                        "
                    >
                        📚 ${rich(q.sectionName)}
                    </div>
                    `
                    :
                    ""
                }


                <div
                    class="solution-question"
                >
                    ${rich(q.question)}
                </div>


                ${
                    q.img &&
                    String(q.img).trim()
                    ?
                    `
                    <div
                        style="
                            text-align:center;
                            margin:15px 0;
                        "
                    >

                        <img
                            src="${escapeAttribute(q.img)}"
                            style="
                                max-width:100%;
                                height:auto;
                                border-radius:12px;
                                border:1px solid #ddd;
                            "
                        >

                    </div>
                    `
                    :
                    ""
                }


                <div
                    style="
                        margin-top:17px;
                        font-size:13px;
                        color:#777;
                        font-weight:800;
                    "
                >
                    Options
                </div>


                ${optionsHTML}


                <div class="answer-box">

                    ${answerHTML}

                </div>


                <div class="explanation-box">

                    <div class="explanation-title">
                        💡 Explanation / Solution
                    </div>


                    <div
                        class="explanation-content notranslate"
                        translate="no"
                    >
                        ${explanation}
                    </div>

                </div>

            </div>

        </div>

    `;


    $("solution-counter").innerText =
        `${solutionCurrent+1} / ${questions.length}`;


    $("solution-middle").innerText =
        `${solutionCurrent+1} / ${questions.length}`;


    $("solution-prev").disabled =
        solutionCurrent === 0;


    $("solution-next").disabled =
        solutionCurrent ===
        questions.length-1;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ============================================================
   SOLUTION PREVIOUS
============================================================ */

function previousSolution(){

    if(
        solutionCurrent <= 0
    ){

        return;
    }


    solutionCurrent--;


    renderSolution();
}


/* ============================================================
   SOLUTION NEXT
============================================================ */

function nextSolution(){

    if(
        solutionCurrent >=
        questions.length-1
    ){

        return;
    }


    solutionCurrent++;


    renderSolution();
}


/* ============================================================
   KEYBOARD
============================================================ */

document.addEventListener(
    "keydown",
    function(event){

        if(
            $("result") &&
            $("result").style.display ===
            "block" &&
            $("solution-view") &&
            $("solution-view").style.display ===
            "block"
        ){

            if(
                event.key === "ArrowLeft"
            ){

                previousSolution();
            }


            if(
                event.key === "ArrowRight"
            ){

                nextSolution();
            }
        }

    }
);
</script>
