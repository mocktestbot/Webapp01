<script>
"use strict";

let questions=[];
let current=0;
let answers=[];
let status=[];
let submitted=false;
let time=0;
let timerInterval=null;
let isReviewMode=false;

let positiveMark=2.0;
let negativeMark=0.25;
let testCutoff=35.0;

let currentTestData=null;
let currentTestId="";
let sourceStylesLoaded=new Set();

const API_BASE_URL="https://mock-bot-l091.onrender.com";


/* ============================================================
   BASIC HELPERS
   ============================================================ */

function $(id){
    return document.getElementById(id);
}


function firstValue(obj,keys){
    if(!obj || typeof obj!=="object"){
        return "";
    }

    for(const key of keys){
        if(
            Object.prototype.hasOwnProperty.call(obj,key) &&
            obj[key]!==null &&
            obj[key]!==undefined &&
            String(obj[key]).trim()!==""
        ){
            return obj[key];
        }
    }

    return "";
}


function escapeHTML(value){
    const div=document.createElement("div");
    div.textContent=String(value??"");
    return div.innerHTML;
}


function escapeAttribute(value){
    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


/* ============================================================
   TEST ID
   ============================================================ */

function getCurrentTestId(){

    const params=new URLSearchParams(
        window.location.search
    );

    const urlTestId=(
        params.get("test_id") ||
        params.get("testId") ||
        params.get("id") ||
        ""
    ).trim();

    if(urlTestId){
        sessionStorage.setItem(
            "currentTestId",
            urlTestId
        );

        return urlTestId;
    }

    return (
        sessionStorage.getItem(
            "currentTestId"
        ) || ""
    ).trim();
}


/* ============================================================
   QUESTION FIELD HELPERS
   ============================================================ */

function getQuestionText(q){

    return firstValue(
        q,
        [
            "question",
            "question_text",
            "questionText",
            "question_title",
            "questionTitle",
            "text",
            "questionName",
            "title",
            "q"
        ]
    );
}


function getExplanation(q){

    return firstValue(
        q,
        [
            "exp",
            "explanation",
            "solution",
            "solution_text",
            "solutionText",
            "answer_explanation",
            "answerExplanation",
            "description"
        ]
    );
}


function getQuestionImage(q){

    return firstValue(
        q,
        [
            "img",
            "image",
            "image_link",
            "imageLink",
            "image_url",
            "imageUrl",
            "question_image",
            "questionImage"
        ]
    );
}


function getSectionName(q,parentSection=""){

    return firstValue(
        q,
        [
            "sectionName",
            "section",
            "subject",
            "category",
            "topic"
        ]
    ) || parentSection || "";
}


/* ============================================================
   OPTIONS NORMALIZER
   ============================================================ */

function getOptions(q){

    if(!q || typeof q!=="object"){
        return [];
    }


    if(Array.isArray(q.options)){
        return q.options;
    }


    const arrayKeys=[
        "choices",
        "answers",
        "option",
        "optionsData",
        "optionList"
    ];


    for(const key of arrayKeys){
        if(Array.isArray(q[key])){
            return q[key];
        }
    }


    const keySets=[
        ["A","B","C","D"],
        ["a","b","c","d"],
        ["optionA","optionB","optionC","optionD"],
        ["option_a","option_b","option_c","option_d"],
        ["option1","option2","option3","option4"]
    ];


    for(const keys of keySets){

        if(
            keys.every(
                key =>
                    Object.prototype.hasOwnProperty.call(
                        q,
                        key
                    )
            )
        ){
            return keys.map(
                key=>q[key]
            );
        }
    }


    if(
        q.options &&
        typeof q.options==="object" &&
        !Array.isArray(q.options)
    ){

        return Object.keys(q.options)
            .sort()
            .map(
                key=>q.options[key]
            );
    }


    return [];
}


/* ============================================================
   ANSWER NORMALIZER
   JSON में correct = 0/1/2/3 है
   ============================================================ */

function normalizeCorrectIndex(q,options){

    if(
        !q ||
        !options.length
    ){
        return -1;
    }


    const raw=firstValue(
        q,
        [
            "correct",
            "correctIndex",
            "answerIndex",
            "correct_answer",
            "correctAnswer",
            "rightAnswer",
            "right_answer"
        ]
    );


    if(
        typeof raw==="number" &&
        Number.isFinite(raw)
    ){

        const n=Math.trunc(raw);

        if(
            n>=0 &&
            n<options.length
        ){
            return n;
        }

        if(
            n>=1 &&
            n<=options.length &&
            !options.some(
                (_,i)=>i===n
            )
        ){
            return n-1;
        }
    }


    if(
        typeof raw==="string"
    ){

        const value=raw.trim();


        const letter=value
            .toUpperCase()
            .match(/^[A-Z]$/);


        if(letter){

            const idx=
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                .indexOf(
                    letter[0]
                );

            if(
                idx>=0 &&
                idx<options.length
            ){
                return idx;
            }
        }


        const numeric=Number(value);

        if(
            Number.isInteger(numeric)
        ){

            if(
                numeric>=0 &&
                numeric<options.length
            ){
                return numeric;
            }

            if(
                numeric>=1 &&
                numeric<=options.length
            ){
                return numeric-1;
            }
        }
    }


    const answerRaw=firstValue(
        q,
        [
            "answer",
            "correctAnswerText",
            "correct_option",
            "correctOption",
            "right_answer_text"
        ]
    );


    if(
        typeof answerRaw==="number" &&
        Number.isFinite(answerRaw)
    ){

        const n=Math.trunc(answerRaw);

        if(
            n>=0 &&
            n<options.length
        ){
            return n;
        }

        if(
            n>=1 &&
            n<=options.length
        ){
            return n-1;
        }
    }


    if(
        answerRaw!==null &&
        answerRaw!==undefined &&
        String(answerRaw).trim()!==""
    ){

        const target=plainText(answerRaw)
            .trim()
            .toLowerCase();


        const idx=options.findIndex(
            option =>
                plainText(option)
                    .trim()
                    .toLowerCase()===target
        );


        if(idx>=0){
            return idx;
        }
    }


    return -1;
}


/* ============================================================
   QUESTION DETECTION
   ============================================================ */

function isQuestionRecord(obj){

    if(
        !obj ||
        typeof obj!=="object" ||
        Array.isArray(obj)
    ){
        return false;
    }


    const text=getQuestionText(obj);
    const options=getOptions(obj);


    return (
        String(text).trim()!=="" &&
        options.length>0
    );
}


/* ============================================================
   RECURSIVE ALL-PART QUESTION LOADER
   ============================================================ */

function collectQuestions(
    node,
    output=[],
    parentSection=""
){

    if(
        node===null ||
        node===undefined
    ){
        return output;
    }


    if(Array.isArray(node)){

        node.forEach(
            item =>
                collectQuestions(
                    item,
                    output,
                    parentSection
                )
        );

        return output;
    }


    if(typeof node!=="object"){
        return output;
    }


    /*
     * Actual question record.
     */
    if(isQuestionRecord(node)){

        output.push({
            raw:node,
            sectionName:getSectionName(
                node,
                parentSection
            )
        });

        return output;
    }


    const currentSection=
        getSectionName(
            node,
            parentSection
        );


    /*
     * IMPORTANT:
     * 05.json में 5 sections हैं:
     *
     * English - 20
     * Hindi - 20
     * Mathematics - 20
     * General Intelligence and Reasoning - 20
     * General Knowledge - 20
     *
     * इसलिए केवल testData.questions पढ़ना पर्याप्त नहीं है.
     * यहाँ सभी nested sections/questions recursively पढ़े जाते हैं.
     */

    const preferredKeys=[
        "questions",
        "questionList",
        "allQuestions",
        "questionsData",
        "items",
        "data",
        "sections",
        "subjects",
        "tests"
    ];


    const processed=new Set();


    for(const key of preferredKeys){

        if(
            !Object.prototype.hasOwnProperty.call(
                node,
                key
            )
        ){
            continue;
        }


        const value=node[key];


        if(
            value &&
            typeof value==="object"
        ){

            processed.add(key);


            collectQuestions(
                value,
                output,
                currentSection
            );
        }
    }


    /*
     * अगर object में custom keys हैं,
     * तब भी nested question sections को खोने नहीं देंगे.
     */
    Object.keys(node).forEach(
        key=>{

            if(processed.has(key)){
                return;
            }


            const value=node[key];


            if(
                value &&
                typeof value==="object"
            ){

                collectQuestions(
                    value,
                    output,
                    currentSection
                );
            }

        }
    );


    return output;
}


/* ============================================================
   NORMALIZE COMPLETE TEST
   ============================================================ */

function normalizeQuestions(testData){

    const collected=
        collectQuestions(
            testData
        );


    const normalized=
        collected.map(
            (entry,index)=>{

                const q=entry.raw;


                const options=
                    getOptions(q);


                const correctIndex=
                    normalizeCorrectIndex(
                        q,
                        options
                    );


                return {

                    ...q,

                    id:
                        firstValue(
                            q,
                            [
                                "id",
                                "qid",
                                "questionId",
                                "number"
                            ]
                        ) ||
                        index+1,

                    question:
                        getQuestionText(q),

                    options:
                        options,

                    correctIndex:
                        correctIndex,

                    answer:
                        correctIndex>=0
                            ? options[
                                correctIndex
                              ]
                            : firstValue(
                                q,
                                [
                                    "answer",
                                    "correctAnswer"
                                ]
                            ),

                    explanation:
                        getExplanation(q),

                    img:
                        getQuestionImage(q),

                    sectionName:
                        entry.sectionName
                };
            }
        )
        .filter(
            q =>
                String(
                    q.question
                ).trim()!=="" &&
                Array.isArray(q.options) &&
                q.options.length>0
        );


    return normalized;
}


/* ============================================================
   PLAIN TEXT FROM HTML
   ============================================================ */

function plainText(value){

    if(
        value===null ||
        value===undefined
    ){
        return "";
    }


    const source=String(value);


    if(!source.trim()){
        return "";
    }


    const parser=
        new DOMParser();


    const doc=
        parser.parseFromString(
            source,
            "text/html"
        );


    doc
        .querySelectorAll(
            "script,style,noscript,template"
        )
        .forEach(
            el=>el.remove()
        );


    return (
        doc.body
            ? doc.body.textContent
            : source
    )
    .replace(
        /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,
        ""
    )
    .replace(
        /\s+/g,
        " "
    )
    .trim();
}


/* ============================================================
   RICH HTML RENDERER
   05.json में text/options/exp पूरा HTML है.
   इसे plain text में convert नहीं किया जाएगा.
   ============================================================ */

function rich(value){

    if(
        value===null ||
        value===undefined
    ){
        return "";
    }


    const source=String(value);


    if(!source.trim()){
        return "";
    }


    const parser=
        new DOMParser();


    const doc=
        parser.parseFromString(
            source,
            "text/html"
        );


    /*
     * JSON के अंदर मौजूद <style> को page head में load करो.
     * इससे KOKILA/MANGAL fonts और formatting काम करेगी.
     */
    doc
        .querySelectorAll(
            "style"
        )
        .forEach(
            style=>{

                const css=
                    style.textContent ||
                    "";


                const key=
                    css.trim();


                if(
                    key &&
                    !sourceStylesLoaded.has(
                        key
                    )
                ){

                    sourceStylesLoaded.add(
                        key
                    );


                    const newStyle=
                        document.createElement(
                            "style"
                        );


                    newStyle.setAttribute(
                        "data-json-style",
                        "true"
                    );


                    newStyle.textContent=
                        css;


                    document.head.appendChild(
                        newStyle
                    );
                }
            }
        );


    /*
     * Head की चीजें body content में नहीं डालनी हैं.
     */
    doc
        .querySelectorAll(
            "script,noscript,template,head,meta,link,title"
        )
        .forEach(
            el=>el.remove()
        );


    /*
     * Unsafe event handlers हटाओ,
     * लेकिन original inline formatting style preserve रहे.
     */
    doc
        .querySelectorAll(
            "*"
        )
        .forEach(
            el=>{

                [...el.attributes]
                    .forEach(
                        attr=>{

                            const name=
                                attr.name
                                    .toLowerCase();


                            if(
                                name.startsWith("on") ||
                                name==="srcdoc"
                            ){

                                el.removeAttribute(
                                    attr.name
                                );
                            }


                            if(
                                name==="href" ||
                                name==="src"
                            ){

                                const val=
                                    String(
                                        attr.value
                                    )
                                    .trim()
                                    .toLowerCase();


                                if(
                                    val.startsWith(
                                        "javascript:"
                                    )
                                ){

                                    el.removeAttribute(
                                        attr.name
                                    );
                                }
                            }

                        }
                    );

            }
        );


    const bodyHTML=
        doc.body
            ? doc.body.innerHTML
            : source;


    const wrapper=
        document.createElement(
            "div"
        );


    wrapper.className=
        "source-content notranslate";


    wrapper.setAttribute(
        "translate",
        "no"
    );


    wrapper.innerHTML=
        bodyHTML;


    return wrapper.outerHTML;
}

async function loadJSONFile(){

/* ============================================================
   LOAD TEST FROM API + LOCAL FALLBACK
   ============================================================ */

async function loadTestData(){

    const errors=[];


    /*
     * पहले clicked Test ID वाला MongoDB test.
     */
    if(currentTestId){

        try{

            const response=
                await fetch(
                    `${API_BASE_URL}/get_test/${encodeURIComponent(currentTestId)}?t=${Date.now()}`,
                    {
                        method:"GET",
                        cache:"no-store",
                        headers:{
                            "Accept":"application/json"
                        }
                    }
                );


            if(
                response.ok
            ){

                const data=
                    await response.json();


                /*
                 * API ने empty/invalid data दिया
                 * तो local 05.json try होगा.
                 */
                const testQuestions=
                    normalizeQuestions(
                        data
                    );


                if(
                    testQuestions.length
                ){

                    return data;
                }


                errors.push(
                    "API returned no readable questions"
                );

            }else{

                errors.push(
                    "API HTTP "+response.status
                );
            }


        }catch(error){

            console.error(
                "API test load failed:",
                error
            );


            errors.push(
                "API "+error.message
            );
        }
    }


    /*
     * IMPORTANT FALLBACK:
     *
     * अगर API unavailable है,
     * तो उसी folder की 05.json पढ़ो.
     *
     * इससे index.html + 05.json
     * साथ में रखने पर test directly चलेगा.
     */
    try{

        const localData=
            await loadJSONFile();


        const localQuestions=
            normalizeQuestions(
                localData
            );


        if(
            localQuestions.length
        ){

            return localData;
        }


        errors.push(
            "05.json में readable questions नहीं मिले"
        );


    }catch(error){

        console.error(
            "Local JSON load failed:",
            error
        );


        errors.push(
            error.message
        );
    }


    throw new Error(
        errors.join(" | ")
    );
}


/* ============================================================
   WINDOW LOAD
   ============================================================ */

window.onload=async function(){

    if(
        window.Telegram &&
        window.Telegram.WebApp
    ){

        window.Telegram.WebApp.ready();
    }


    currentTestId=
        getCurrentTestId();


    const params=
        new URLSearchParams(
            window.location.search
        );


    const savedAnswers=
        params.get("answers");


    try{

        currentTestData=
            await loadTestData();


        /*
         * ALL PARTS / ALL SECTIONS / ALL QUESTIONS.
         */
        questions=
            normalizeQuestions(
                currentTestData
            );


        if(
            !questions.length
        ){

            throw new Error(
                "No questions found in test data"
            );
        }


        /*
         * Test settings.
         */
        positiveMark=
            getNumberSetting(
                currentTestData,
                [
                    "positive_mark",
                    "positiveMark",
                    "positive",
                    "marks",
                    "mark",
                    "pos"
                ],
                2
            );


        negativeMark=
            getNumberSetting(
                currentTestData,
                [
                    "negative_mark",
                    "negativeMark",
                    "negative",
                    "neg"
                ],
                .25
            );


        testCutoff=
            getNumberSetting(
                currentTestData,
                [
                    "cutoff",
                    "pass_mark",
                    "passing_score"
                ],
                35
            );


        /*
         * 05.json:
         * test_mode = overall
         * section time = 60
         *
         * Overall test में पहला section का time
         * fallback के रूप में use होगा.
         */
        const testTime=
            getTestTime(
                currentTestData
            );


        time=
            Math.max(
                1,
                testTime
            )*60;


        $("totalq").innerText=
            questions.length;


        answers=
            new Array(
                questions.length
            ).fill(null);


        status=
            new Array(
                questions.length
            ).fill("notvisited");


        /*
         * Saved answers review mode.
         */
        if(savedAnswers){

            isReviewMode=true;
            submitted=true;


            try{

                const parsed=
                    JSON.parse(
                        savedAnswers
                    );


                if(
                    Array.isArray(parsed)
                ){

                    answers=
                        questions.map(
                            (_,i)=>{

                                const value=
                                    parsed[i];


                                if(
                                    value===null ||
                                    value===undefined ||
                                    value===""
                                ){

                                    return null;
                                }


                                const n=
                                    Number(
                                        value
                                    );


                                return Number.isFinite(
                                    n
                                )
                                    ? n
                                    : null;
                            }
                        );
                }

            }catch(error){

                console.error(
                    "Saved answers parse error:",
                    error
                );
            }


            $("top-title").innerText=
                "📊 Test Analysis";


            executeSubmit(
                true
            );


        }else{

            startTimer();

            loadQuestion();
        }


    }catch(error){

        console.error(
            "FINAL TEST LOAD ERROR:",
            error
        );


        showError(
            "⚠️ टेस्ट लोड नहीं हो सका",
            "05.json या MongoDB से question data पढ़ने में समस्या हुई।"
        );
    }
};


/* ============================================================
   NUMBER SETTINGS
   ============================================================ */

function getNumberSetting(
    data,
    keys,
    fallback
){

    const direct=
        firstValue(
            data,
            keys
        );


    if(
        direct!=="" &&
        Number.isFinite(
            Number(direct)
        )
    ){

        return Number(
            direct
        );
    }


    if(
        Array.isArray(data)
    ){

        for(
            const section of data
        ){

            const value=
                firstValue(
                    section,
                    keys
                );


            if(
                value!=="" &&
                Number.isFinite(
                    Number(value)
                )
            ){

                return Number(
                    value
                );
            }
        }
    }


    if(
        data &&
        Array.isArray(
            data.sections
        )
    ){

        for(
            const section of data.sections
        ){

            const value=
                firstValue(
                    section,
                    keys
                );


            if(
                value!=="" &&
                Number.isFinite(
                    Number(value)
                )
            ){

                return Number(
                    value
                );
            }
        }
    }


    return fallback;
}


/* ============================================================
   TEST TIME
   ============================================================ */

function getTestTime(data){

    /*
     * Explicit overall time.
     */
    const direct=
        firstValue(
            data,
            [
                "time_limit",
                "timeLimit",
                "duration",
                "duration_minutes",
                "total_time",
                "totalTime"
            ]
        );


    if(
        direct!=="" &&
        Number(direct)>0
    ){

        return Number(
            direct
        );
    }


    /*
     * Top-level array:
     * 05.json में हर section में time = 60 है.
     *
     * test_mode = overall है,
     * इसलिए overall test को 60 minutes रखा गया है.
     */
    if(
        Array.isArray(data) &&
        data.length
    ){

        const first=
            data.find(
                x =>
                    x &&
                    typeof x==="object"
            );


        if(first){

            const sectionTime=
                Number(
                    first.time
                );


            if(
                Number.isFinite(
                    sectionTime
                ) &&
                sectionTime>0
            ){

                return sectionTime;
            }
        }
    }


    /*
     * Object containing sections.
     */
    if(
        data &&
        Array.isArray(
            data.sections
        ) &&
        data.sections.length
    ){

        const first=
            data.sections[0];


        const sectionTime=
            Number(
                first?.time
            );


        if(
            Number.isFinite(
                sectionTime
            ) &&
            sectionTime>0
        ){

            return sectionTime;
        }
    }


    return 60;
}

/* ============================================================
   TIMER
   ============================================================ */

function startTimer(){

    clearInterval(
        timerInterval
    );


    updateTimerUI();


    timerInterval=
        setInterval(
            ()=>{

                time--;


                updateTimerUI();


                if(
                    time<=0
                ){

                    clearInterval(
                        timerInterval
                    );


                    executeSubmit();
                }

            },
            1000
        );
}


function updateTimerUI(){

    const safeTime=
        Math.max(
            0,
            time
        );


    const m=
        Math.floor(
            safeTime/60
        );


    const s=
        safeTime%60;


    $("timer").innerText=
        String(m).padStart(
            2,
            "0"
        )+
        ":"+
        String(s).padStart(
            2,
            "0"
        );


    $("lastMin").innerText=
        "Last "+
        String(m).padStart(
            2,
            "0"
        )+
        " Mins";


    if(
        safeTime<=60
    ){

        $("timer").style.color=
            "#e53935";
    }
}


/* ============================================================
   QUESTION SCREEN
   ============================================================ */

function loadQuestion(){

    if(
        !questions.length
    ){
        return;
    }


    if(
        current<0
    ){
        current=0;
    }


    if(
        current>=questions.length
    ){

        current=
            questions.length-1;
    }


    const q=
        questions[current];


    let html=
        "<div class='qcard notranslate' translate='no'>";


    if(
        q.sectionName &&
        String(
            q.sectionName
        ).trim()!==""
    ){

        html+=
            "<div class='section-name notranslate' translate='no'>"+
            "📚 "+
            rich(
                q.sectionName
            )+
            "</div>";
    }


    html+=
        "<div class='qtitle notranslate' translate='no'>"+
        "Q"+
        (current+1)+
        ". "+
        rich(
            q.question
        )+
        "</div>";


    if(
        q.img &&
        String(
            q.img
        ).trim()!==""
    ){

        html+=
            "<div style='text-align:center;padding:10px;'>"+
            "<img src='"+
            escapeAttribute(
                q.img
            )+
            "' style='max-width:100%;height:auto;border-radius:8px;border:1px solid #ddd;'>"+
            "</div>";
    }


    q.options.forEach(
        (opt,i)=>{

            const selected=
                Number(
                    answers[current]
                )===
                Number(i)
                    ? " selected"
                    : "";


            html+=
                "<div class='option notranslate"+
                selected+
                "' translate='no' onclick='selectOption(this,"+
                i+
                ")'>"+

                "<div class='circle'></div>"+

                "<div>"+
                rich(
                    opt
                )+
                "</div>"+

                "</div>";
        }
    );


    html+=
        "</div>";


    $("exam").innerHTML=
        html;


    $("qno").innerText=
        current+1;


    updatePalette();


    window.scrollTo(
        0,
        0
    );
}


/* ============================================================
   OPTION SELECT
   ============================================================ */

function selectOption(
    el,
    i
){

    if(submitted){
        return;
    }


    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            option =>
                option.classList.remove(
                    "selected"
                )
        );


    el.classList.add(
        "selected"
    );


    answers[current]=
        Number(i);


    status[current]=
        "answered";


    updatePalette();
}


/* ============================================================
   NAVIGATION
   ============================================================ */

function saveNext(){

    if(
        answers[current]===null ||
        answers[current]===undefined
    ){

        if(
            status[current]!=="review"
        ){

            status[current]=
                "notanswered";
        }
    }


    if(
        current<
        questions.length-1
    ){

        current++;


        loadQuestion();

    }else{

        updatePalette();
    }
}


function previousQuestion(){

    if(
        current>0
    ){

        current--;

        loadQuestion();
    }
}


function markReview(){

    status[current]=
        "review";


    if(
        current<
        questions.length-1
    ){

        current++;

        loadQuestion();

    }else{

        updatePalette();
    }
}

function togglePalette(){

function updatePalette(){

    let html="";


    questions.forEach(
        (_,i)=>{

            html+=

                i+
                ")'>"+
                (i+1)+

function goQ(i){

    const index=
        Number(i);


    if(
        !Number.isInteger(index) ||
        index<0 ||
        index>=questions.length
    ){
        return;
    }


    current=index;


    loadQuestion();


    $("palette")
        .classList.remove(
            "active"
        );
}

/* ============================================================
   SUBMIT
   ============================================================ */

function executeSubmit(
    isFromHistory=false
){

    hideSubmitConfirm();


    if(
        submitted &&
        !isFromHistory
    ){
        return;
    }


    submitted=true;


    clearInterval(
        timerInterval
    );


    let correct=0;
    let incorrect=0;
    let unattempted=0;


    questions.forEach(
        (q,i)=>{

            const userAns=
                answers[i];


            const correctIndex=
                Number(
                    q.correctIndex
                );


            if(
                userAns===null ||
                userAns===undefined ||
                userAns===""
            ){

                unattempted++;

            }else if(
                Number(userAns)===
                correctIndex
            ){

                correct++;

            }else{

                incorrect++;
            }
        }
    );


    const score=
        (
            correct*
            positiveMark
        )-
        (
            incorrect*
            negativeMark
        );


    const maxScore=
        questions.length*
        positiveMark;


    const accuracy=
        (
            correct/
            (
                correct+
                incorrect ||
                1
            )*
            100
        ).toFixed(2);


    /*
     * Score backend में भेजो.
     */
    if(
        !isFromHistory
    ){

        submitScoreToBackend(
            score,
            accuracy
        );
    }


    generateResultScreen(
        score,
        maxScore,
        correct,
        incorrect,
        unattempted,
        accuracy
    );
}


/* ============================================================
   SCORE BACKEND
   ============================================================ */

async function submitScoreToBackend(
    score,
    accuracy
){

    const params=
        new URLSearchParams(
            window.location.search
        );


    const uid=
        params.get("uid");


    const name=
        params.get("name");


    const testId=
        currentTestId ||
        params.get("test_id");


    if(
        !uid ||
        !name ||
        !testId
    ){

        return;
    }


    let testName=
        firstValue(
            currentTestData,
            [
                "test_name",
                "testName",
                "name",
                "title"
            ]
        );


    if(
        !testName &&
        Array.isArray(
            currentTestData
        )
    ){

        testName=
            firstValue(
                currentTestData[0],
                [
                    "test_name",
                    "testName",
                    "name",
                    "title"
                ]
            );
    }


    if(!testName){
        testName="Mock Test";
    }


    try{

        await fetch(
            `${API_BASE_URL}/submit_score`,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({

                        user_id:
                            parseInt(
                                uid,
                                10
                            ),

                        first_name:
                            name,

                        test_id:
                            testId,

                        test_name:
                            testName,

                        score:
                            parseFloat(
                                score
                            ),

                        accuracy:
                            parseFloat(
                                accuracy
                            )
                    })
            }
        );

    }catch(error){

        console.error(
            "Score submit error:",
            error
        );
    }
}

        "<span style='color:#e53935;font-size:24px;font-weight:bold;'>"+
        incorrect+
        "</span><br><small>Wrong</small>"+
        "</div>"+

        "<div>"+
        "<span style='color:#ff9800;font-size:24px;font-weight:bold;'>"+
        unattempted+
        "</span><br><small>Skipped</small>"+
        "</div>"+

        "</div>"+

        "<br>"+

        "<b>Accuracy: "+
        accuracy+
        "%</b>"+

        "</div>"+

        "<div style='max-width:300px;margin:0 auto;'>"+
        "<canvas id='chart'></canvas>"+
        "</div>"+

        "<h3 style='margin-top:30px;border-bottom:2px solid #ccc;padding-bottom:5px;'>"+
        "Full Analysis"+
        "</h3>";


    /*
     * FULL 100 QUESTIONS / ALL 5 PARTS.
     */
    questions.forEach(
        (q,i)=>{

            const userAns=
                answers[i];


            const correctIndex=
                Number(
                    q.correctIndex
                );


            let boxClass=
                "analysis-box";


            let statusText="";


            if(
                userAns===null ||
                userAns===undefined
            ){

                boxClass+=
                    " unattempted-box";


                statusText=
                    "<span style='color:#e65100;font-weight:bold;background:#ffe0b2;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "⚠️ Skipped ( 0 )"+
                    "</span>";

            }else if(
                Number(userAns)===
                correctIndex
            ){

                boxClass+=
                    " correct-box";


                statusText=
                    "<span style='color:#1b5e20;font-weight:bold;background:#c8e6c9;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "✅ Correct ( +"+
                    positiveMark+
                    " )"+
                    "</span>";

            }else{

                boxClass+=
                    " wrong-box";


                statusText=
                    "<span style='color:#b71c1c;font-weight:bold;background:#ffcdd2;padding:5px 10px;border-radius:6px;font-size:12px;'>"+
                    "❌ Wrong ( -"+
                    negativeMark+
                    " )"+
                    "</span>";
            }


            html+=
                "<div class='"+
                boxClass+
                " notranslate' translate='no'>";


            if(
                q.sectionName &&
                String(
                    q.sectionName
                ).trim()!==""
            ){

                html+=
                    "<div style='display:inline-block;background:#eaf9ff;color:#008ccc;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:bold;margin-bottom:10px;'>"+
                    "📚 "+
                    rich(
                        q.sectionName
                    )+
                    "</div>";
            }


            html+=
                "<div style='display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;font-size:16px;'>"+

                "<div style='flex:1;min-width:0;line-height:1.55;'>"+
                "<b>Q"+
                (i+1)+
                ". "+
                rich(
                    q.question
                )+
                "</b>"+
                "</div>"+

                "<div style='text-align:right;min-width:100px;margin-left:10px;'>"+
                statusText+
                "</div>"+

                "</div>";


            if(
                q.img &&
                String(
                    q.img
                ).trim()!==""
            ){

                html+=
                    "<div style='text-align:center;padding:10px;'>"+
                    "<img src='"+
                    escapeAttribute(
                        q.img
                    )+
                    "' style='max-width:100%;height:auto;border-radius:8px;border:1px solid #ddd;'>"+
                    "</div>";
            }


            html+=
                "<div style='margin-top:10px;'>";


            q.options.forEach(
                (opt,optIndex)=>{

                    let optStyle=
                        "padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid #eee;background:#fafafa;color:#333;line-height:1.55;";


                    let icon="⚪";


                    if(
                        Number(optIndex)===
                        correctIndex
                    ){

                        optStyle=
                            "padding:12px;margin-bottom:8px;border-radius:8px;border:2px solid #4CAF50;background:#e8f5e9;font-weight:bold;color:#2e7d32;line-height:1.55;";

                        icon="✅";

                    }else if(
                        userAns!==null &&
                        userAns!==undefined &&
                        Number(optIndex)===
                        Number(userAns)
                    ){

                        optStyle=
                            "padding:12px;margin-bottom:8px;border-radius:8px;border:2px solid #e53935;background:#ffebee;font-weight:bold;color:#c62828;line-height:1.55;";

                        icon="❌";
                    }


                    html+=
                        "<div class='notranslate' translate='no' style='"+
                        optStyle+
                        "'>"+
                        icon+
                        " "+
                        rich(
                            opt
                        )+
                        "</div>";
                }
            );


            html+=
                "</div>"+

                "<hr style='border:0;border-top:1px dashed #ccc;margin:20px 0 15px;'>"+

                "<div style='background:#f4f9ff;padding:15px;border-radius:10px;border:1px solid #d0e3ff;box-shadow:inset 0 2px 4px rgba(0,0,0,.02);'>"+

                "<div style='display:inline-block;background:linear-gradient(135deg,#00bfff,#007acc);color:white;padding:6px 14px;border-radius:6px;font-weight:bold;font-size:14px;margin-bottom:12px;'>"+
                "💡 Explanation (व्याख्या)"+
                "</div>"+

                "<div class='notranslate' translate='no' style='line-height:1.6;font-size:14px;color:#444;overflow-wrap:anywhere;'>"+
                (
                    q.explanation &&
                    String(
                        q.explanation
                    ).trim()!==""
                        ? rich(
                            q.explanation
                          )
                        : "इस प्रश्न के लिए कोई व्याख्या उपलब्ध नहीं है।"
                )+
                "</div>"+

                "</div>"+

                "</div>";
        }
    );


    html+=
        `
        <div class="promo-banner notranslate" translate="no">

            <h3>🚀 और नए मॉक टेस्ट चाहिए?</h3>

            <p>
                हमारे आधिकारिक टेलीग्राम चैनल से जुड़ें और हर दिन नए टेस्ट, स्टडी मटेरियल और अपडेट्स पाएं!
            </p>

            <a
                href="https://t.me/+bmzuj2Y68nFmYTc9"
                class="promo-btn"
            >
                📢 अभी चैनल ज्वाइन करें
            </a>

        </div>
        `;


    $("result").innerHTML=
        html;


    const chartCanvas=
        $("chart");


    if(
        chartCanvas
    ){

        new Chart(
            chartCanvas,
            {
                type:"doughnut",

                data:{
                    labels:[
                        "Correct",
                        "Incorrect",
                        "Skipped"
                    ],

                    datasets:[
                        {
                            data:[
                                correct,
                                incorrect,
                                unattempted
                            ],

                            backgroundColor:[
                                "#4CAF50",
                                "#e53935",
                                "#ff9800"
                            ]
                        }
                    ]
                },

                options:{
                    responsive:true,
                    maintainAspectRatio:true
                }
            }
        );
    }


    window.scrollTo(
        0,
        0
    );
}

</script>

</body>
</html>
